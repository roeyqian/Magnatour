import groovy.json.JsonSlurper

def importGroupsConfigFile = layout.projectDirectory.file("gradle/format/config/java-import-groups.json")
def javaSourceFiles = fileTree("src") {
	include "**/*.java"
}

def loadImportGroupDefinitions = {
	new JsonSlurper().parse(importGroupsConfigFile.asFile)
}

def findImportGroup = { String importLine, List importGroups ->
	def importedQualifiedName = importLine.substring("import ".length()).replace(";", "").trim()
	if (importedQualifiedName.startsWith("static ")) {
		importedQualifiedName = importedQualifiedName.substring("static ".length())
	}

	def matchingImportGroup = importGroups.find { group ->
		group.prefixes.any { prefix -> importedQualifiedName.startsWith(prefix) }
	}
	matchingImportGroup ?: importGroups.find { group -> group.title == "Other" }
}

def buildImportSortKey = { String importLine ->
	def importedQualifiedName = importLine.substring("import ".length()).replace(";", "").trim()
	if (importedQualifiedName.startsWith("static ")) {
		importedQualifiedName = importedQualifiedName.substring("static ".length()).trim()
	}
	[segments: importedQualifiedName.tokenize("."), name: importedQualifiedName, line: importLine]
}

