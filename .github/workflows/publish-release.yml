name: publish-release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          game_version="$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2- | tr -d '\r')"
          release_name="${RELEASE_NAME:-$RELEASE_TAG}"
          lower="$(printf '%s %s' "$RELEASE_TAG" "$release_name" | tr '[:upper:]' '[:lower:]')"

          if [[ "$lower" == *alpha* ]]; then
            version_type="alpha"
          elif [[ "$lower" == *beta* || "$lower" == *-rc* || "$lower" == *" rc"* ]]; then
            version_type="beta"
          elif [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            version_type="beta"
          else
            version_type="release"
          fi

          echo "game_version=$game_version" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "version_type=$version_type" >> "$GITHUB_OUTPUT"

      - name: Download release JAR assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          repository = os.environ["REPOSITORY"]
          release_id = os.environ["RELEASE_ID"]
          token = os.environ["GITHUB_TOKEN"]
          outdir = pathlib.Path("release-assets")
          assets_endpoint = f"https://api.github.com/repos/{repository}/releases/{release_id}/assets?per_page=100"

          api_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "magnatour-release-publisher",
          }

          def request_json(url: str) -> list[dict]:
              request = urllib.request.Request(url, headers=api_headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def publishable(asset: dict) -> bool:
              name = asset["name"].lower()
              return (
                  name.endswith(".jar")
                  and not name.endswith("-sources.jar")
                  and not name.endswith("-javadoc.jar")
                  and not name.endswith("-dev.jar")
              )

          assets = []
          for attempt in range(12):
              assets = [asset for asset in request_json(assets_endpoint) if publishable(asset)]
              if assets:
                  break
              time.sleep(10)

          if not assets:
              sys.exit("No publishable JAR assets were found on the GitHub release.")

          download_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/octet-stream",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "magnatour-release-publisher",
          }

          for asset in assets:
              target = outdir / asset["name"]
              request = urllib.request.Request(asset["url"], headers=download_headers)
              try:
                  with urllib.request.urlopen(request) as response, target.open("wb") as file:
                      file.write(response.read())
              except urllib.error.HTTPError as error:
                  sys.exit(f"Failed to download {asset['name']}: HTTP {error.code}")
              print(f"Downloaded {target}")
          PY

      - name: Publish to Modrinth and CurseForge
        uses: Kira-NT/mc-publish@v3.3
        with:
          files: release-assets/*.jar
          name: ${{ steps.meta.outputs.release_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: ${{ steps.meta.outputs.version_type }}
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.game_version }}
          modrinth-id: xu8wy0oC
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1595314
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
