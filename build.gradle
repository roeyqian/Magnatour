def importGroupFor = { String importLine, List groups ->
    def imported = importLine.substring("import ".length()).replace(";", "").trim()
    if (imported.startsWith("static ")) {
        imported = imported.substring("static ".length())
    }

    def matched = groups.find { group ->
        group.prefixes.any { prefix -> imported.startsWith(prefix) }
    }
    matched ?: groups.find { group -> group.title == "Other" }
}

def rewriteJavaImports = { File sourceFile, List groups, boolean checkOnly ->
    def original = sourceFile.getText("UTF-8")
    def newline = original.contains("\r\n") ? "\r\n" : "\n"
    List<String> lines = original.readLines()
    List<Integer> importIndexes = []

    lines.eachWithIndex { line, index ->
        if (line.startsWith("import ")) {
            importIndexes << index
        }
    }
    if (importIndexes.isEmpty()) {
        return false
    }

    int start = importIndexes.first()
    while (start > 0 && (lines[start - 1].trim().isEmpty() || lines[start - 1].startsWith("// "))) {
        start--
    }
    if (start > 0 && lines[start].trim().isEmpty() && lines[start - 1].startsWith("package ")) {
        start++
    }

    int end = importIndexes.last() + 1
    while (end < lines.size() && (lines[end].trim().isEmpty() || lines[end].startsWith("// "))) {
        if (lines[end].startsWith("// ")) {
            end++
        } else if (end + 1 < lines.size() && (lines[end + 1].startsWith("import ") || lines[end + 1].startsWith("// "))) {
            end++
        } else {
            break
        }
    }

    def imports = []
    def seen = [] as Set
    lines.subList(start, end).each { line ->
        def stripped = line.trim()
        if (stripped.startsWith("import ") && seen.add(stripped)) {
            imports << stripped
        }
    }

    def grouped = groups.collectEntries { group -> [(group.title): []] }
    imports.each { importLine ->
        grouped[importGroupFor(importLine, groups).title] << importLine
    }

    def block = []
    groups.each { group ->
        def importsInGroup = grouped[group.title]
        if (!importsInGroup.isEmpty()) {
            if (!block.isEmpty()) {
                block << ""
            }
            block << "// ${group.title}"
            block.addAll(importsInGroup)
        }
    }

    def rewrittenLines = []
    rewrittenLines.addAll(lines.subList(0, start))
    rewrittenLines.addAll(block)
    rewrittenLines.addAll(lines.subList(end, lines.size()))

    def rewritten = rewrittenLines.join(newline)
    if (original.endsWith("\n") || original.endsWith("\r\n")) {
        rewritten += newline
    }
    if (rewritten == original) {
        return false
    }
    if (!checkOnly) {
        sourceFile.write(rewritten, "UTF-8")
    }
    true
}

def parseCompleteAnnotationLine = { String line ->
    def matcher = line =~ /^(\s*)(\S(?:.*\S)?)\s*$/
    if (!matcher.matches()) {
        return null
    }

    def indent = matcher.group(1)
    def text = matcher.group(2).trim()
    def index = 0
    def seenAnnotation = false

    while (true) {
        while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
            index++
        }
        if (index >= text.length()) {
            break
        }
        if (text.charAt(index) != '@' as char) {
            return null
        }
        seenAnnotation = true
        index++

        def nameStart = index
        while (index < text.length()) {
            def c = text.charAt(index)
            if (Character.isLetterOrDigit(c) || c == '_' as char || c == '.' as char || c == '$' as char) {
                index++
            } else {
                break
            }
        }
        if (index == nameStart) {
            return null
        }

        while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
            index++
        }
        if (index < text.length() && text.charAt(index) == '(' as char) {
            def depth = 0
            def inString = false
            def inChar = false
            def escaping = false
            while (index < text.length()) {
                def c = text.charAt(index)
                if (escaping) {
                    escaping = false
                } else if (inString) {
                    if (c == '\\' as char) {
                        escaping = true
                    } else if (c == '"' as char) {
                        inString = false
                    }
                } else if (inChar) {
                    if (c == '\\' as char) {
                        escaping = true
                    } else if (c == "'" as char) {
                        inChar = false
                    }
                } else if (c == '"' as char) {
                    inString = true
                } else if (c == "'" as char) {
                    inChar = true
                } else if (c == '(' as char) {
                    depth++
                } else if (c == ')' as char) {
                    depth--
                    if (depth == 0) {
                        index++
                        break
                    }
                    if (depth < 0) {
                        return null
                    }
                }
                index++
            }
            if (depth != 0 || inString || inChar) {
                return null
            }
        }

        while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
            index++
        }
        if (index >= text.length()) {
            break
        }
        if (text.charAt(index) != '@' as char) {
            return null
        }
    }

    seenAnnotation ? [indent: indent, text: text] : null
}

