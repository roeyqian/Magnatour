def packageDeclarationTokenPattern = ~/\/\*[\s\S]*?\*\/|\/\/[^\r\n]*|"""[\s\S]*?"""|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|\b(package\s+\p{javaJavaIdentifierStart}\p{javaJavaIdentifierPart}*(?:\s*\.\s*\p{javaJavaIdentifierStart}\p{javaJavaIdentifierPart}*)*\s*;)/
def scanNextImportOrComment = { String source, int cursor ->
	while (cursor < source.length() && Character.isWhitespace(source.charAt(cursor))) {
		cursor++
	}
	if (cursor >= source.length()) {
		return null
	}
	int start = cursor
	if (source.startsWith("//", cursor)) {
		while (cursor < source.length() && source.charAt(cursor) != '\n' as char && source.charAt(cursor) != '\r' as char) {
			cursor++
		}
		return [kind: "comment", text: source.substring(start, cursor), start: start, end: cursor]
	}
	if (source.startsWith("/*", cursor)) {
		int close = source.indexOf("*/", cursor + 2)
		if (close < 0) {
			return null
		}
		cursor = close + 2
		return [kind: "comment", text: source.substring(start, cursor), start: start, end: cursor]
	}
	if (!source.startsWith("import", cursor)
			|| (cursor + 6 < source.length() && Character.isJavaIdentifierPart(source.charAt(cursor + 6)))) {
		return null
	}

	def importTextWithoutComments = new StringBuilder("import ")
	cursor += 6
	while (cursor < source.length()) {
		if (source.startsWith("/*", cursor)) {
			int close = source.indexOf("*/", cursor + 2)
			if (close < 0) {
				return null
			}
			cursor = close + 2
			importTextWithoutComments.append(' ')
		} else if (source.startsWith("//", cursor)) {
			while (cursor < source.length() && source.charAt(cursor) != '\n' as char && source.charAt(cursor) != '\r' as char) {
				cursor++
			}
			importTextWithoutComments.append(' ')
		} else {
			char currentCharacter = source.charAt(cursor++)
			importTextWithoutComments.append(currentCharacter)
			if (currentCharacter == ';' as char) {
				def normalizedImportText = importTextWithoutComments.toString().replaceAll(/\s+/, " ").replaceAll(/\s*\.\s*/, ".").replaceAll(/\s*;$/, ";")
				return [kind: "import", text: source.substring(start, cursor), importKey: normalizedImportText, start: start, end: cursor]
			}
			if (!Character.isJavaIdentifierPart(currentCharacter) && !Character.isWhitespace(currentCharacter) && currentCharacter != '.' as char && currentCharacter != '*' as char) {
				return null
			}
		}
	}
	null
}

def normalizeJavaFileHeaderAndImports = { File sourceFile, List importGroups, boolean checkOnly ->
	def originalSourceText = sourceFile.getText("UTF-8")
	def lineSeparator = originalSourceText.contains("\r\n") ? "\r\n" : "\n"
	def sourceText = originalSourceText
	def packageMatcher = packageDeclarationTokenPattern.matcher(sourceText)
	def packageToken = null
	while (packageMatcher.find()) {
		if (packageMatcher.group(1) != null) {
			packageToken = [text: packageMatcher.group(1), end: packageMatcher.end(1)]
			break
		}
	}
	if (packageToken == null) {
		return false
	}

	def sourcePath = project.relativePath(sourceFile).replace('\\', '/')
	def licenseHeader = modEntrypointSourcePaths.contains(sourcePath) ? entrypointLicenseHeaderText : shortLicenseHeaderText
	def formattedSections = [licenseHeader.readLines().join(lineSeparator) + lineSeparator + packageToken.text]

	def importAndCommentTokens = []
	int cursor = packageToken.end as int
	while (true) {
		def token = scanNextImportOrComment(sourceText, cursor)
		if (token == null) {
			break
		}
		importAndCommentTokens << token
		cursor = token.end as int
	}

	def importGroupCommentLines = importGroups.collect { "// ${it.title}".toString() } as Set
	def importsByGroupTitle = importGroups.collectEntries { group -> [(group.title): []] }
	def importsByLine = [:]
	def pendingComments = []
	Map<String, Object> importCommentContext = new LinkedHashMap<String, Object>()
	importCommentContext.put("previousTokenEnd", packageToken.end as int)
	importAndCommentTokens.each { token ->
		String text = token.text
		if (token.kind == "import") {
			def importLine = text.replaceFirst(/^import\s*/, "import ").trim()
			def importEntry = [line: importLine, comments: new ArrayList(pendingComments), suffix: "", sortKey: buildImportSortKey(token.importKey)]
			pendingComments.clear()
			if (!importsByLine.containsKey(importLine)) {
				importsByLine[importLine] = importEntry
				importsByGroupTitle[findImportGroup(token.importKey, importGroups).title] << importEntry
			} else {
				importsByLine[importLine].comments.addAll(importEntry.comments)
			}
			importCommentContext.put("previousImport", importsByLine[importLine])
		} else {
			Map previousImport = importCommentContext.get("previousImport") as Map
			def textBetweenTokens = sourceText.substring(importCommentContext.get("previousTokenEnd") as int, token.start as int)
			if (previousImport != null && !textBetweenTokens.contains("\n") && !textBetweenTokens.contains("\r")) {
				previousImport.suffix += " ${text}"
			} else {
				if (!importGroupCommentLines.contains(text)) {
					pendingComments << text
				}
				importCommentContext.remove("previousImport")
			}
		}
		importCommentContext.put("previousTokenEnd", token.end as int)
	}

	importGroups.each { group ->
		def groupImports = importsByGroupTitle[group.title]
		if (!groupImports.isEmpty()) {
			groupImports.sort { left, right ->
				List<String> leftImportSegments = left.sortKey.segments as List<String>
				List<String> rightImportSegments = right.sortKey.segments as List<String>
				for (int index = 0; index < Math.min(leftImportSegments.size(), rightImportSegments.size()); index++) {
					boolean leftIsFinalSegment = index == leftImportSegments.size() - 1
					boolean rightIsFinalSegment = index == rightImportSegments.size() - 1
					if (leftIsFinalSegment != rightIsFinalSegment) {
						return leftIsFinalSegment ? -1 : 1
					}
					int segmentComparison = leftImportSegments.get(index).compareToIgnoreCase(rightImportSegments.get(index))
					if (segmentComparison != 0) {
						return segmentComparison
					}
				}
				(leftImportSegments.size() <=> rightImportSegments.size())
						?: (left.sortKey.name <=> right.sortKey.name)
						?: (left.sortKey.line <=> right.sortKey.line)
						?: (left.line <=> right.line)
			}
			def lines = ["// ${group.title}"]
			groupImports.each { importEntry ->
				lines.addAll(importEntry.comments)
				lines << "${importEntry.line}${importEntry.suffix}"
			}
			formattedSections << lines.join(lineSeparator)
		}
	}

	def remainingSourceText = sourceText.substring(cursor)
	if (!pendingComments.isEmpty()) {
		remainingSourceText = pendingComments.join(lineSeparator) + remainingSourceText
	}
	remainingSourceText = remainingSourceText.replaceFirst(/^\s+/, "")
	if (!remainingSourceText.isEmpty()) {
		formattedSections << remainingSourceText
	}
	def formattedSourceText = formattedSections.join(lineSeparator + lineSeparator)
	if (formattedSourceText == originalSourceText) {
		return false
	}
	if (!checkOnly) {
		sourceFile.write(formattedSourceText, "UTF-8")
	}
	true
}

def createInMemoryJavaSourceFile = { File sourceFile, String source ->
	new SimpleJavaFileObject(sourceFile.toURI(), JavaFileObject.Kind.SOURCE) {
		@Override
		CharSequence getCharContent(boolean ignoreEncodingErrors) {
			source
		}
	}
}

def parseJavaCompilationUnit = { File sourceFile, String source ->
	def javaCompiler = ToolProvider.systemJavaCompiler
	if (javaCompiler == null) {
		throw new GradleException("Java body tasks require Gradle to run on a JDK, not a JRE.")
	}

	def parseDiagnostics = new DiagnosticCollector<JavaFileObject>()
	def javacParseTask = javaCompiler.getTask(
			null,
			null,
			parseDiagnostics,
			["-proc:none"],
			null,
			[createInMemoryJavaSourceFile(sourceFile, source)]
	) as JavacTask
	def compilationUnits = javacParseTask.parse().toList()
	def parseErrors = parseDiagnostics.diagnostics.findAll { it.kind == Diagnostic.Kind.ERROR }
	if (!parseErrors.isEmpty()) {
		throw new GradleException("Unable to parse ${sourceFile}: ${parseErrors.collect { it.getMessage(Locale.ROOT) }.join("; ")}")
	}
	if (compilationUnits.isEmpty()) {
		return null
	}

	[unit: compilationUnits.first(), positions: Trees.instance(javacParseTask).sourcePositions]
}

def removeCommentsBetweenAnnotations = { File sourceFile, String source ->
	def parsed = parseJavaCompilationUnit(sourceFile, source)
	if (parsed == null) return source
	def annotationRanges = []
	def scanner = new TreeScanner<Void, Void>() {
		@Override
		Void visitAnnotation(com.sun.source.tree.AnnotationTree annotationTree, Void unused) {
			int start = parsed.positions.getStartPosition(parsed.unit, annotationTree) as int
			int end = parsed.positions.getEndPosition(parsed.unit, annotationTree) as int
			if (start >= 0 && end > start) annotationRanges << [start: start, end: end]
			// Nested annotation values belong to this annotation, not to the gap after it.
			return null
		}
	}
	scanner.scan(parsed.unit, null)
	annotationRanges.sort { it.start }
	def replacements = []
	for (int index = 1; index < annotationRanges.size(); index++) {
		int start = annotationRanges[index - 1].end as int
		int end = annotationRanges[index].start as int
		if (end < start) continue
		String gap = source.substring(start, end)
		if (!(gap ==~ /(?:\s|\/\*[\s\S]*?\*\/|\/\/[^\r\n]*(?:\r?\n|$))*/)
				|| !(gap =~ /\/\*|\/\//).find()) continue
		// Remove only comments in a gap containing no other Java tokens. Collapse
		// comment-only lines so that the existing annotation merge can continue.
		String strippedGap = gap.replaceAll(/\/\*[\s\S]*?\*\/|\/\/[^\r\n]*/, "")
		int lastNewline = strippedGap.lastIndexOf("\n")
		String replacement = lastNewline >= 0
				? (source.contains("\r\n") ? "\r\n" : "\n") + strippedGap.substring(lastNewline + 1)
				: " "
		replacements << [start: start, end: end, text: replacement]
	}
	def rewritten = new StringBuilder(source)
	replacements.reverseEach { replacement ->
		rewritten.replace(replacement.start as int, replacement.end as int, replacement.text as String)
	}
	rewritten.toString()
}

def mergeConsecutiveAnnotationLines = { File sourceFile, boolean checkOnly, String inputSource = null ->
	def originalSourceText = inputSource == null ? sourceFile.getText("UTF-8") : inputSource
	def sourceWithoutAnnotationComments = removeCommentsBetweenAnnotations(sourceFile, originalSourceText)
	def lineSeparator = originalSourceText.contains("\r\n") ? "\r\n" : "\n"
	def lines = sourceWithoutAnnotationComments.readLines()
	def rewrittenLines = []
	// Use javac's annotation nodes, never text that merely looks like an annotation.
	def annotationLines = [] as Set
	def parsed = parseJavaCompilationUnit(sourceFile, sourceWithoutAnnotationComments)
	def annotationScanner = new TreeScanner<Void, Void>() {
		@Override
		Void visitAnnotation(com.sun.source.tree.AnnotationTree annotationTree, Void unused) {
			int start = parsed.positions.getStartPosition(parsed.unit, annotationTree) as int
			if (start >= 0) {
				annotationLines << sourceWithoutAnnotationComments.substring(0, start).count("\n")
			}
			super.visitAnnotation(annotationTree, unused)
			return null
		}
	}
	if (parsed != null) {
		annotationScanner.scan(parsed.unit, null)
	}

	for (def index = 0; index < lines.size();) {
		def currentAnnotationLine = annotationLines.contains(index) ? parseAnnotationOnlyLine(lines[index]) : null
		if (currentAnnotationLine == null) {
			rewrittenLines << lines[index]
			index++
			continue
		}

		def annotationTexts = [currentAnnotationLine.text]
		def nextIndex = index + 1
		while (nextIndex < lines.size()) {
			def nextAnnotationLine = annotationLines.contains(nextIndex) ? parseAnnotationOnlyLine(lines[nextIndex]) : null
			if (nextAnnotationLine == null || nextAnnotationLine.indent != currentAnnotationLine.indent) {
				break
			}
			annotationTexts << nextAnnotationLine.text
			nextIndex++
		}

		if (annotationTexts.size() > 1) {
			rewrittenLines << "${currentAnnotationLine.indent}${annotationTexts.join(" ")}"
			index = nextIndex
		} else {
			rewrittenLines << lines[index]
			index++
		}
	}

	def formattedSourceText = rewrittenLines.join(lineSeparator)
	if (originalSourceText.endsWith("\n") || originalSourceText.endsWith("\r\n")) {
		formattedSourceText += lineSeparator
	}
	if (inputSource != null) {
		return formattedSourceText
	}
	if (formattedSourceText == originalSourceText) {
		return false
	}
	if (!checkOnly) {
		sourceFile.write(formattedSourceText, "UTF-8")
	}
	true
}

def findLineStart = { String source, int index ->
	int cursor = Math.max(0, Math.min(index, source.length()))
	while (cursor > 0 && source.charAt(cursor - 1) != '\n' as char && source.charAt(cursor - 1) != '\r' as char) {
		cursor--
	}
	cursor
}

def findPreviousLineStart = { String source, int lineStart ->
	if (lineStart <= 0) {
		return 0
	}
	int cursor = lineStart - 1
	if (cursor > 0 && source.charAt(cursor) == '\n' as char && source.charAt(cursor - 1) == '\r' as char) {
		cursor--
	}
	while (cursor > 0 && source.charAt(cursor - 1) != '\n' as char && source.charAt(cursor - 1) != '\r' as char) {
		cursor--
	}
	cursor
}

def getLineIndentation = { String source, int index ->
	int start = findLineStart(source, index)
	int cursor = start
	while (cursor < source.length()) {
		def currentCharacter = source.charAt(cursor)
		if (currentCharacter != ' ' as char && currentCharacter != '\t' as char) {
			break
		}
		cursor++
	}
	source.substring(start, cursor)
}

def findDeclarationStartWithLeadingComments = { String source, int lowerBound, int declarationStart ->
	int cursor = findLineStart(source, declarationStart)
	while (cursor > lowerBound) {
		int previousLineStartIndex = findPreviousLineStart(source, cursor)
		def line = source.substring(previousLineStartIndex, cursor)
		def trimmed = line.trim()
		if (trimmed.isEmpty()
				|| trimmed.startsWith("//")
				|| trimmed.startsWith("/*")
				|| trimmed.startsWith("*")
				|| trimmed.endsWith("*/")) {
			cursor = previousLineStartIndex
			continue
		}
		break
	}
	Math.max(cursor, lowerBound)
}

def trimLeadingAndTrailingBlankLines = { String text ->
	def lines = text.readLines()
	int start = 0
	int end = lines.size()
	while (start < end && lines[start].trim().isEmpty()) {
		start++
	}
	while (end > start && lines[end - 1].trim().isEmpty()) {
		end--
	}
	lines.subList(start, end).join("\n")
}

def findDeclarationBodyOrSemicolon = { String text, int start, int end ->
	boolean insideLineComment = false
	boolean insideBlockComment = false
	boolean insideStringLiteral = false
	boolean insideCharacterLiteral = false
	boolean isEscapedCharacter = false
	int parenthesisDepth = 0
	int squareBracketDepth = 0

	for (int index = start; index < end; index++) {
		char currentCharacter = text.charAt(index)
		char nextCharacter = index + 1 < end ? text.charAt(index + 1) : (char) 0

		if (insideLineComment) {
			if (currentCharacter == '\n' as char || currentCharacter == '\r' as char) {
				insideLineComment = false
			}
			continue
		}
		if (insideBlockComment) {
			if (currentCharacter == '*' as char && nextCharacter == '/' as char) {
				insideBlockComment = false
				index++
			}
			continue
		}
		if (isEscapedCharacter) {
			isEscapedCharacter = false
			continue
		}
		if (insideStringLiteral) {
			if (currentCharacter == '\\' as char) {
				isEscapedCharacter = true
			} else if (currentCharacter == '"' as char) {
				insideStringLiteral = false
			}
			continue
		}
		if (insideCharacterLiteral) {
			if (currentCharacter == '\\' as char) {
				isEscapedCharacter = true
			} else if (currentCharacter == "'" as char) {
				insideCharacterLiteral = false
			}
			continue
		}

		if (currentCharacter == '/' as char && nextCharacter == '/' as char) {
			insideLineComment = true
			index++
		} else if (currentCharacter == '/' as char && nextCharacter == '*' as char) {
			insideBlockComment = true
			index++
		} else if (currentCharacter == '"' as char) {
			insideStringLiteral = true
		} else if (currentCharacter == "'" as char) {
			insideCharacterLiteral = true
		} else if (currentCharacter == '(' as char) {
			parenthesisDepth++
		} else if (currentCharacter == ')' as char) {
			parenthesisDepth = Math.max(0, parenthesisDepth - 1)
		} else if (currentCharacter == '[' as char) {
			squareBracketDepth++
		} else if (currentCharacter == ']' as char) {
			squareBracketDepth = Math.max(0, squareBracketDepth - 1)
		} else if ((currentCharacter == '{' as char || currentCharacter == ';' as char) && parenthesisDepth == 0 && squareBracketDepth == 0) {
			return [index: index, marker: currentCharacter]
		}
	}
	null
}

def findLastTopLevelParenthesisPair = { String text, int start, int end ->
	boolean insideLineComment = false
	boolean insideBlockComment = false
	boolean insideStringLiteral = false
	boolean insideCharacterLiteral = false
	boolean isEscapedCharacter = false
	int parenthesisDepth = 0
	int currentOpeningParenthesis = -1
	def lastParenthesisPair = null

	for (int index = start; index < end; index++) {
		char currentCharacter = text.charAt(index)
		char nextCharacter = index + 1 < end ? text.charAt(index + 1) : (char) 0

		if (insideLineComment) {
			if (currentCharacter == '\n' as char || currentCharacter == '\r' as char) {
				insideLineComment = false
			}
			continue
		}
		if (insideBlockComment) {
			if (currentCharacter == '*' as char && nextCharacter == '/' as char) {
				insideBlockComment = false
				index++
			}
			continue
		}
		if (isEscapedCharacter) {
			isEscapedCharacter = false
			continue
		}
		if (insideStringLiteral) {
			if (currentCharacter == '\\' as char) {
				isEscapedCharacter = true
			} else if (currentCharacter == '"' as char) {
				insideStringLiteral = false
			}
			continue
		}
		if (insideCharacterLiteral) {
			if (currentCharacter == '\\' as char) {
				isEscapedCharacter = true
			} else if (currentCharacter == "'" as char) {
				insideCharacterLiteral = false
			}
			continue
		}

		if (currentCharacter == '/' as char && nextCharacter == '/' as char) {
			insideLineComment = true
			index++
		} else if (currentCharacter == '/' as char && nextCharacter == '*' as char) {
			insideBlockComment = true
			index++
		} else if (currentCharacter == '"' as char) {
			insideStringLiteral = true
		} else if (currentCharacter == "'" as char) {
			insideCharacterLiteral = true
		} else if (currentCharacter == '(' as char) {
			if (parenthesisDepth == 0) {
				currentOpeningParenthesis = index
			}
			parenthesisDepth++
		} else if (currentCharacter == ')' as char) {
			parenthesisDepth--
			if (parenthesisDepth == 0 && currentOpeningParenthesis >= 0) {
				lastParenthesisPair = [open: currentOpeningParenthesis, close: index]
			}
		}
	}
	lastParenthesisPair
}

def splitAtTopLevelCommas = { String text ->
	def commaSeparatedParts = []
	boolean insideLineComment = false
	boolean insideBlockComment = false
	boolean insideStringLiteral = false
	boolean insideCharacterLiteral = false
	boolean isEscapedCharacter = false
	int parenthesisDepth = 0
	int typeArgumentDepth = 0
	int squareBracketDepth = 0
	int partStart = 0

	for (int index = 0; index < text.length(); index++) {
		char currentCharacter = text.charAt(index)
		char nextCharacter = index + 1 < text.length() ? text.charAt(index + 1) : (char) 0
		if (insideLineComment) {
			if (currentCharacter == '\n' as char || currentCharacter == '\r' as char) insideLineComment = false
			continue
		}
		if (insideBlockComment) {
			if (currentCharacter == '*' as char && nextCharacter == '/' as char) {
				insideBlockComment = false
				index++
			}
			continue
		}
		if (isEscapedCharacter) {
			isEscapedCharacter = false
			continue
		}
		if (insideStringLiteral) {
			if (currentCharacter == '\\' as char) {
				isEscapedCharacter = true
			} else if (currentCharacter == '"' as char) {
				insideStringLiteral = false
			}
			continue
		}
		if (insideCharacterLiteral) {
			if (currentCharacter == '\\' as char) {
				isEscapedCharacter = true
			} else if (currentCharacter == "'" as char) {
				insideCharacterLiteral = false
			}
			continue
		}

		if (currentCharacter == '/' as char && nextCharacter == '/' as char) {
			insideLineComment = true
			index++
		} else if (currentCharacter == '/' as char && nextCharacter == '*' as char) {
			insideBlockComment = true
			index++
		} else if (currentCharacter == '"' as char) {
			insideStringLiteral = true
		} else if (currentCharacter == "'" as char) {
			insideCharacterLiteral = true
		} else if (currentCharacter == '(' as char) {
			parenthesisDepth++
		} else if (currentCharacter == ')' as char) {
			parenthesisDepth = Math.max(0, parenthesisDepth - 1)
		} else if (currentCharacter == '[' as char) {
			squareBracketDepth++
		} else if (currentCharacter == ']' as char) {
			squareBracketDepth = Math.max(0, squareBracketDepth - 1)
		} else if (currentCharacter == '<' as char) {
			typeArgumentDepth++
		} else if (currentCharacter == '>' as char) {
			typeArgumentDepth = Math.max(0, typeArgumentDepth - 1)
		} else if (currentCharacter == ',' as char && parenthesisDepth == 0 && typeArgumentDepth == 0 && squareBracketDepth == 0) {
			commaSeparatedParts << text.substring(partStart, index)
			partStart = index + 1
		}
	}
	commaSeparatedParts << text.substring(partStart)
	commaSeparatedParts
}

def collapseDeclarationWhitespace = { String text ->
	// Keep literal contents and comment text byte-for-byte while collapsing whitespace.
	text.replaceAll(/\/\*[\s\S]*?\*\/|\/\/[^\r\n]*(?:\r?\n|$)|"""[\s\S]*?"""|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|\s+/) { token ->
		Character.isWhitespace(token.charAt(0)) ? " " : token
	}.trim()
}

def javaMemberIndentation = "  "

def indentFirstLine = { String text, String indent ->
	if (indent.isEmpty() || text.isEmpty()) {
		return text
	}
	"${indent}${text}"
}

def normalizeDeclarationParameterList = { String text, List parameterTypes = null ->
	def markerInfo = findDeclarationBodyOrSemicolon(text, 0, text.length())
	if (markerInfo == null) {
		return text
	}

	def markerIndex = markerInfo.index as int
	def marker = markerInfo.marker as char
	def parameterParenthesisPair = findLastTopLevelParenthesisPair(text, 0, markerIndex)
	if (parameterParenthesisPair == null) {
		def header = text.substring(0, markerIndex).replaceAll(/[ \t]+$/, "")
		return header + (marker == '{' as char ? " {" : ";") + text.substring(markerIndex + 1)
	}

	int openingParenthesisIndex = parameterParenthesisPair.open as int
	int closingParenthesisIndex = parameterParenthesisPair.close as int
	def declarationBeforeParameters = text.substring(0, openingParenthesisIndex).replaceAll(/[ \t\r\n]+$/, "")
	def parameterListText = text.substring(openingParenthesisIndex + 1, closingParenthesisIndex)
	def declarationAfterParameters = collapseDeclarationWhitespace(text.substring(closingParenthesisIndex + 1, markerIndex))
	def spacedDeclarationSuffix = declarationAfterParameters.isEmpty() ? "" : " ${declarationAfterParameters}"
	def declarationBodyText = text.substring(markerIndex + 1)
	def declarationIndentation = getLineIndentation(text, openingParenthesisIndex)

	if (parameterListText.trim().isEmpty()) {
		def header = "${declarationBeforeParameters}()${spacedDeclarationSuffix}"
		if (marker == ';' as char) {
			return "${header};${declarationBodyText}"
		}
		if (declarationBodyText.trim() == "}") {
			return "${header} {}"
		}
		return "${header} {${declarationBodyText}"
	}

	def parameterIndentation = "${declarationIndentation}    "
	def formattedParameters = splitAtTopLevelCommas(parameterListText).collect { collapseDeclarationWhitespace(it) }.findAll { !it.isEmpty() }
	def lineCommentsByParameter = formattedParameters.collect { parameter ->
		def tokens = parameter =~ /\/\*[\s\S]*?\*\/|"""[\s\S]*?"""|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|(\/\/[^\r\n]*)/
		def comments = []
		while (tokens.find()) {
			if (tokens.group(1) != null) comments << [start: tokens.start(), end: tokens.end()]
		}
		comments
	}
	def formattedDeclaration = new StringBuilder()
	formattedDeclaration << declarationBeforeParameters << "(\n"
	formattedParameters.eachWithIndex { parameterText, index ->
		boolean sameTypeAsPrevious = parameterTypes != null && parameterTypes.size() == formattedParameters.size()
				&& index > 0 && parameterTypes[index] == parameterTypes[index - 1]
		// A line comment must end before the next parameter, even if the types match.
		boolean adjacentLineComment = !lineCommentsByParameter[index].isEmpty()
				|| (index > 0 && !lineCommentsByParameter[index - 1].isEmpty())
		if (index > 0) formattedDeclaration << (sameTypeAsPrevious && !adjacentLineComment ? " " : "\n${parameterIndentation}")
		else formattedDeclaration << parameterIndentation
		if (index + 1 < formattedParameters.size()) {
			def trailingComment = lineCommentsByParameter[index].find { parameterText.substring(it.end as int).trim().isEmpty() }
			if (trailingComment != null) {
				int commentStart = trailingComment.start as int
				formattedDeclaration << parameterText.substring(0, commentStart).replaceAll(/[ \t]+$/, "")
				formattedDeclaration << ", " << parameterText.substring(commentStart)
			} else {
				formattedDeclaration << parameterText << ","
			}
		} else {
			formattedDeclaration << parameterText
		}
	}
	formattedDeclaration << "\n" << declarationIndentation << ")" << spacedDeclarationSuffix
	if (marker == ';' as char) {
		formattedDeclaration << ";" << declarationBodyText
	} else if (declarationBodyText.trim() == "}") {
		formattedDeclaration << " {}"
	} else {
		formattedDeclaration << " {" << declarationBodyText
	}
	formattedDeclaration.toString()
}

def parseAnnotationRangeAt = { String text, int start ->
	int index = start
	if (index >= text.length() || text.charAt(index) != '@' as char) {
		return null
	}
	index++

	int annotationNameStart = index
	while (index < text.length()) {
		def currentCharacter = text.charAt(index)
		if (Character.isLetterOrDigit(currentCharacter) || currentCharacter == '_' as char || currentCharacter == '.' as char || currentCharacter == '$' as char) {
			index++
		} else {
			break
		}
	}
	if (index == annotationNameStart) {
		return null
	}

	while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
		index++
	}
	if (index < text.length() && text.charAt(index) == '(' as char) {
		boolean insideStringLiteral = false
		boolean insideCharacterLiteral = false
		boolean isEscapedCharacter = false
		int parenthesisDepth = 0
		while (index < text.length()) {
			char currentCharacter = text.charAt(index)
			if (isEscapedCharacter) {
				isEscapedCharacter = false
			} else if (insideStringLiteral) {
				if (currentCharacter == '\\' as char) {
					isEscapedCharacter = true
				} else if (currentCharacter == '"' as char) {
					insideStringLiteral = false
				}
			} else if (insideCharacterLiteral) {
				if (currentCharacter == '\\' as char) {
					isEscapedCharacter = true
				} else if (currentCharacter == "'" as char) {
					insideCharacterLiteral = false
				}
			} else if (currentCharacter == '"' as char) {
				insideStringLiteral = true
			} else if (currentCharacter == "'" as char) {
				insideCharacterLiteral = true
			} else if (currentCharacter == '(' as char) {
				parenthesisDepth++
			} else if (currentCharacter == ')' as char) {
				parenthesisDepth--
				if (parenthesisDepth == 0) {
					index++
					break
				}
			}
			index++
		}
		if (parenthesisDepth != 0 || insideStringLiteral || insideCharacterLiteral) {
			return null
		}
	}

	[start: start, end: index]
}

def normalizeAnnotationText = { String text ->
	collapseDeclarationWhitespace(text)
}

def normalizeClassDeclarationHeader = { String text, String declarationIndent, List parameterTypes = null, int implementedTypeCount = 0 ->
	def markerInfo = findDeclarationBodyOrSemicolon(text, 0, text.length())
	if (markerInfo == null || markerInfo.marker != '{' as char) {
		return text
	}

	int markerIndex = markerInfo.index as int
	def prefix = text.substring(0, markerIndex)
	def suffix = text.substring(markerIndex + 1)
	def annotations = []
	int cursor = 0
	while (cursor < prefix.length()) {
		while (cursor < prefix.length() && Character.isWhitespace(prefix.charAt(cursor))) {
			cursor++
		}
		def annotation = parseAnnotationRangeAt(prefix, cursor)
		if (annotation == null) {
			break
		}
		annotations << normalizeAnnotationText(prefix.substring(annotation.start as int, annotation.end as int))
		cursor = annotation.end as int
	}

	def declarationPart = collapseDeclarationWhitespace(prefix.substring(cursor))
	def normalizedDeclaration = normalizeDeclarationParameterList("${declarationIndent}${declarationPart} {", parameterTypes)
			.replaceAll(/\s+\{\s*$/, " {")
	if (implementedTypeCount >= 2) {
		// Skip comments and literals so that only the actual implements keyword wraps.
		def tokens = normalizedDeclaration =~ /\/\*[\s\S]*?\*\/|\/\/[^\r\n]*|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|\bimplements\b/
		while (tokens.find()) {
			if (tokens.group() == "implements") {
				int keywordStart = tokens.start()
				normalizedDeclaration = normalizedDeclaration.substring(0, keywordStart).replaceAll(/\s+$/, "") +
						"\n${declarationIndent}    " + normalizedDeclaration.substring(keywordStart)
				break
			}
		}
	}

	def lines = []
	if (!annotations.isEmpty()) {
		lines << "${declarationIndent}${annotations.join(" ")}"
	}
	lines << normalizedDeclaration
	lines.join("\n") + suffix
}

def normalizeMethodOrConstructorBlock = { String text, List parameterTypes ->
	normalizeDeclarationParameterList(trimLeadingAndTrailingBlankLines(text), parameterTypes)
}

def normalizeFieldOrInitializerBlock = { String text ->
	trimLeadingAndTrailingBlankLines(text)
}

def implicitJavaLangTypeNames = [
		"Appendable", "AutoCloseable", "Boolean", "Byte", "Character", "CharSequence", "Class", "ClassLoader",
		"Cloneable", "Comparable", "Double", "Enum", "Exception", "Float", "FunctionalInterface", "Integer",
		"Iterable", "Long", "Math", "Number", "Object", "Override", "Package", "Process", "ProcessBuilder",
		"Record", "Runnable", "Runtime", "RuntimeException", "Short", "StackTraceElement", "String",
		"StringBuffer", "StringBuilder", "SuppressWarnings", "System", "Thread", "Throwable", "Void"
] as Set

def collectImportedTypeNames = { String source ->
	def qualifiedTypeNamesBySimpleName = [:]
	source.readLines().each { line ->
		def matcher = line =~ /^\s*import\s+(?!static)([\w.]+)\.([A-Za-z_$][\w$]*);\s*$/
		if (matcher.matches()) {
			qualifiedTypeNamesBySimpleName[matcher.group(2)] = "${matcher.group(1)}.${matcher.group(2)}"
		}
	}
	qualifiedTypeNamesBySimpleName
}

def buildQualifiedTypeSortName = { Object typeTree, Map importedTypesBySimpleName ->
	if (typeTree == null) {
		return ""
	}
	def normalizedTypeName = typeTree.toString()
	normalizedTypeName = normalizedTypeName.replaceAll(/@\s*[\w.]+(\s*\([^)]*\))?\s*/, "")
	normalizedTypeName = normalizedTypeName.replace("...", "[]")
	normalizedTypeName = normalizedTypeName.replaceAll(/\s+/, "")
	// Expand simple names only; already-qualified names must not gain a second package prefix.
	normalizedTypeName.replaceAll(/(?<![\w$.])([A-Z][A-Za-z0-9_$]*)\b/) { matchedTypeName, simpleName ->
		if (importedTypesBySimpleName.containsKey(simpleName)) {
			return importedTypesBySimpleName[simpleName]
		}
		if (implicitJavaLangTypeNames.contains(simpleName)) {
			return "java.lang.${simpleName}"
		}
		simpleName
	}
}

def buildParameterTypeSortKey = { MethodTree methodTree, Map importedTypesBySimpleName ->
	methodTree.parameters.collect { parameter ->
		buildQualifiedTypeSortName(parameter.type, importedTypesBySimpleName)
	}.join(",")
}

def buildFieldTypeSortKey = { VariableTree variableTree, Map importedTypesBySimpleName ->
	def typeName = buildQualifiedTypeSortName(variableTree.type, importedTypesBySimpleName)
	[typeName.length(), typeName]
}

def hasModifier = { tree, Modifier modifier ->
	tree.modifiers.flags.contains(modifier)
}

def isRegistryPackage = { Object compilationUnit ->
	def packageName = compilationUnit.packageName?.toString()
	if (packageName == null) {
		return false
	}

	packageName == "registry"
			|| packageName.endsWith(".registry")
			|| packageName.contains(".registry.")
}

def shouldSkipJavaDeclarationFormatting = { ClassTree classTree, Object compilationUnit ->
	if (!isRegistryPackage(compilationUnit)) {
		return false
	}

	def kindName = classTree.kind.name()
	boolean isFinalClass = kindName == "CLASS" && hasModifier(classTree, Modifier.FINAL)
	boolean isRecordDeclaration = kindName == "RECORD"
	isFinalClass || isRecordDeclaration
}

def getVisibilitySortRank = { tree ->
	if (hasModifier(tree, Modifier.PUBLIC)) {
		return 0
	}
	if (hasModifier(tree, Modifier.PROTECTED)) {
		return 1
	}
	if (hasModifier(tree, Modifier.PRIVATE)) {
		return 2
	}
	3
}

def getMemberOrderKind = { tree ->
	if (tree instanceof VariableTree) return "field"
	if (tree instanceof MethodTree) return tree.name.toString() == "<init>" ? "constructor" : "method"
	if (tree instanceof ClassTree) return "type"
	"initializer"
}

def matchesMemberOrderGroup = { Map group, String kind, String visibility, boolean isStatic, boolean isFinal ->
	group.kind == kind && (!(kind in ["field", "method"])
			|| (group.visibility.contains(visibility) && group.static == isStatic
					&& (!group.containsKey("final") || group.final == isFinal)))
}

def loadJavaDeclarationOrder = {
	def config = new JsonSlurper().parse(declarationOrderConfigFile.asFile)
	def fail = { String message ->
		throw new GradleException("Invalid ${declarationOrderConfigFile.asFile}: ${message}")
	}
	if (!(config instanceof Map) || config.keySet() != (["groups"] as Set)
			|| !(config.groups instanceof List) || config.groups.isEmpty()) {
		fail("expected an object containing a nonempty groups array")
	}
	def allowedKeysByKind = [
			field: ["initialized", "typeOrder", "typeLength", "typeName", "name", "names"],
			method: ["firstInvocation", "name", "parameterCount", "parameterTypes"],
			constructor: ["parameterCount", "parameterTypes"],
			type: ["name"], initializer: []
	]
	def groupNames = [] as Set
	config.groups.eachWithIndex { group, index ->
		if (!(group instanceof Map) || !(group.name instanceof String) || group.name.trim().isEmpty()
				|| !groupNames.add(group.name) || !allowedKeysByKind.containsKey(group.kind)) {
			fail("group ${index} needs a unique name and a supported kind")
		}
		def allowedProperties = ["name", "kind", "sortBy"] as Set
		if (group.kind in ["field", "method"]) allowedProperties.addAll(["visibility", "static", "final"])
		if (group.kind == "field") allowedProperties.add("fieldTypes")
		if (!allowedProperties.containsAll(group.keySet()) || !(group.sortBy instanceof List)
				|| !allowedKeysByKind[group.kind].containsAll(group.sortBy)
				|| group.sortBy.toSet().size() != group.sortBy.size()) {
			fail("group '${group.name}' has unknown properties or invalid/duplicate sortBy keys")
		}
		if (group.kind in ["field", "method"]) {
			if (!(group.visibility instanceof List) || group.visibility.isEmpty()
					|| !["public", "protected", "private", "package"].containsAll(group.visibility)
					|| group.visibility.toSet().size() != group.visibility.size() || !(group.static instanceof Boolean)) {
				fail("group '${group.name}' needs a visibility array and a boolean static value")
			}
			if (group.containsKey("final") && !(group.final instanceof Boolean)) {
				fail("group '${group.name}' final must be a boolean when specified")
			}
		}
		if (group.kind == "field") {
			if (!(group.fieldTypes instanceof List) || group.fieldTypes.any { !(it instanceof String) || it.trim().isEmpty() }
					|| group.fieldTypes.toSet().size() != group.fieldTypes.size()) {
				fail("group '${group.name}' needs a fieldTypes array of unique nonempty type names")
			}
		}
	}
	// Every supported member must match exactly one group, so omissions and overlaps
	// fail before any Java files are formatted or written.
	allowedKeysByKind.keySet().each { kind ->
		def visibilities = kind in ["field", "method"] ? ["public", "protected", "private", "package"] : ["package"]
		def staticValues = kind in ["field", "method"] ? [false, true] : [false]
		def finalValues = kind in ["field", "method"] ? [false, true] : [false]
		visibilities.each { visibility ->
			staticValues.each { isStatic ->
				finalValues.each { isFinal ->
					if (config.groups.count { matchesMemberOrderGroup(it, kind, visibility, isStatic, isFinal) } != 1) {
						fail("expected exactly one group for ${kind}, visibility=${visibility}, static=${isStatic}, final=${isFinal}")
					}
				}
			}
		}
	}
	config.groups
}

def findMemberOrderGroupIndex = { tree, List orderGroups ->
	def kind = getMemberOrderKind(tree)
	def visibility = kind in ["field", "method"] ? ["public", "protected", "private", "package"][getVisibilitySortRank(tree)] : "package"
	boolean isStatic = kind in ["field", "method"] && hasModifier(tree, Modifier.STATIC)
	boolean isFinal = kind in ["field", "method"] && hasModifier(tree, Modifier.FINAL)
	orderGroups.findIndexOf { matchesMemberOrderGroup(it, kind, visibility, isStatic, isFinal) }
}

def collectMethodFirstInvocationOrder = { ClassTree classTree, Object sourcePositions, Object compilationUnit ->
	def firstInvocationOrderByName = [:]
	int[] nextInvocationOrder = [0] as int[]
	def methodInvocationScanner = new TreeScanner<Void, Void>() {
		@Override
		Void visitClass(ClassTree nestedClassTree, Void unused) {
			if (nestedClassTree == classTree) {
				super.visitClass(nestedClassTree, unused)
			}
			return null
		}

		@Override
		Void visitMethodInvocation(MethodInvocationTree invocationTree, Void unused) {
			def invokedMethodExpression = invocationTree.methodSelect
			def invokedMethodName = invokedMethodExpression instanceof MemberSelectTree
					? invokedMethodExpression.identifier.toString()
					: invokedMethodExpression instanceof IdentifierTree ? invokedMethodExpression.name.toString() : invokedMethodExpression.toString()
			if (!firstInvocationOrderByName.containsKey(invokedMethodName)) {
				firstInvocationOrderByName[invokedMethodName] = nextInvocationOrder[0]++
			}
			super.visitMethodInvocation(invocationTree, unused)
			return null
		}
	}

	// Scan callers in a canonical order, independent of the current declaration order.
	classTree.members.findAll { !(it instanceof ClassTree) }.sort { left, right ->
		def key = { tree -> tree instanceof MethodTree
				? "method:${tree.name}:${tree.parameters.collect { it.type.toString() }.join(',')}"
				: tree instanceof VariableTree ? "field:${tree.name}" : "${tree.kind}:${tree}" }
		key(left) <=> key(right)
	}.each { methodInvocationScanner.scan(it, null) }
	firstInvocationOrderByName
}

def compareSortKeys = { List left, List right ->
	int maxKeyLength = Math.max(left.size(), right.size())
	for (int index = 0; index < maxKeyLength; index++) {
		def leftValue = index < left.size() ? left[index] : null
		def rightValue = index < right.size() ? right[index] : null
		if (leftValue == rightValue) {
			continue
		}
		if (leftValue == null) {
			return -1
		}
		if (rightValue == null) {
			return 1
		}
		int valueComparison = leftValue <=> rightValue
		if (valueComparison != 0) {
			return valueComparison
		}
	}
	0
}

def sortJavaMembers = { List memberUnits, Closure buildMemberSortKey ->
	memberUnits.sort { left, right ->
		compareSortKeys.call(buildMemberSortKey.call(left) as List, buildMemberSortKey.call(right) as List) as int
	}
}

def repairFieldDependencyOrder = { List firstPassMembers, ClassTree classTree ->
	// Second pass: use first-pass positions as the priority of a stable topological
	// sort. Only field dependencies may override the configured category/name order.
	Map<String, Integer> fieldIndexes = [:]
	firstPassMembers.eachWithIndex { member, int index ->
		if (member.tree instanceof VariableTree) {
			member.trees.each { field -> fieldIndexes[field.name.toString()] = index }
		}
	}
	def dependents = firstPassMembers.collect { new LinkedHashSet<Integer>() }
	def dependencyCounts = firstPassMembers.collect { 0 }
	firstPassMembers.eachWithIndex { member, int index ->
		if (!(member.tree instanceof VariableTree)) return
		def dependencies = new LinkedHashSet<Integer>()
		def localScopes = [new LinkedHashSet<String>()]
		def addDependency = { String name, boolean qualified = false ->
			if (!qualified && localScopes.any { it.contains(name) }) return
			Integer dependency = fieldIndexes[name]
			if (dependency != null && dependency != index) dependencies.add(dependency)
		}
		def scanner = new TreeScanner<Void, Void>() {
			@Override
			Void visitIdentifier(IdentifierTree tree, Void unused) {
				addDependency(tree.name.toString())
				return null
			}

			@Override
			Void visitMemberSelect(MemberSelectTree tree, Void unused) {
				String owner = tree.expression.toString()
				if (owner == "this" || owner == classTree.simpleName.toString()) {
					addDependency(tree.identifier.toString(), true)
				} else {
					scan(tree.expression, unused)
				}
				return null
			}

			@Override
			Void visitMethodInvocation(MethodInvocationTree tree, Void unused) {
				// An unqualified method name is not a field reference. Its receiver is.
				if (tree.methodSelect instanceof MemberSelectTree) scan(tree.methodSelect.expression, unused)
				scan(tree.arguments, unused)
				return null
			}

			@Override
			Void visitLambdaExpression(com.sun.source.tree.LambdaExpressionTree tree, Void unused) {
				localScopes.add(new LinkedHashSet<String>(tree.parameters.collect { it.name.toString() }))
				scan(tree.body, unused)
				localScopes.remove(localScopes.size() - 1)
				return null
			}

			@Override
			Void visitBlock(com.sun.source.tree.BlockTree tree, Void unused) {
				localScopes.add(new LinkedHashSet<String>())
				scan(tree.statements, unused)
				localScopes.remove(localScopes.size() - 1)
				return null
			}

			@Override
			Void visitVariable(VariableTree tree, Void unused) {
				localScopes.last().add(tree.name.toString())
				if (tree.initializer != null) scan(tree.initializer, unused)
				return null
			}

			@Override
			Void visitForLoop(com.sun.source.tree.ForLoopTree tree, Void unused) {
				localScopes.add(new LinkedHashSet<String>())
				super.visitForLoop(tree, unused)
				localScopes.remove(localScopes.size() - 1)
				return null
			}

			@Override
			Void visitEnhancedForLoop(com.sun.source.tree.EnhancedForLoopTree tree, Void unused) {
				scan(tree.expression, unused)
				localScopes.add(new LinkedHashSet<String>([tree.variable.name.toString()]))
				scan(tree.statement, unused)
				localScopes.remove(localScopes.size() - 1)
				return null
			}

			@Override
			Void visitCatch(com.sun.source.tree.CatchTree tree, Void unused) {
				localScopes.add(new LinkedHashSet<String>([tree.parameter.name.toString()]))
				scan(tree.block, unused)
				localScopes.remove(localScopes.size() - 1)
				return null
			}

			@Override
			Void visitNewClass(com.sun.source.tree.NewClassTree tree, Void unused) {
				if (tree.enclosingExpression != null) scan(tree.enclosingExpression, unused)
				scan(tree.arguments, unused)
				// Anonymous-class bodies have their own declaration/forward-reference scope.
				return null
			}

			@Override
			Void visitClass(ClassTree tree, Void unused) { return null }

			@Override
			Void visitTypeCast(com.sun.source.tree.TypeCastTree tree, Void unused) {
				scan(tree.expression, unused)
				return null
			}

			@Override
			Void visitNewArray(com.sun.source.tree.NewArrayTree tree, Void unused) {
				scan(tree.dimensions, unused)
				if (tree.initializers != null) scan(tree.initializers, unused)
				return null
			}
		}
		member.trees.each { field -> if (field.initializer != null) scanner.scan(field.initializer, null) }
		dependencies.each { Integer dependency ->
			dependents[dependency].add(index)
			dependencyCounts[index]++
		}
	}
	def ready = new TreeSet<Integer>()
	dependencyCounts.eachWithIndex { count, int index -> if (count == 0) ready.add(index) }
	def repaired = []
	while (!ready.isEmpty()) {
		Integer index = ready.pollFirst()
		repaired << firstPassMembers[index]
		dependents[index].each { Integer dependent ->
			dependencyCounts[dependent]--
			if (dependencyCounts[dependent] == 0) ready.add(dependent)
		}
	}
	if (repaired.size() != firstPassMembers.size()) {
		def blockedFields = fieldIndexes.findAll { name, index -> dependencyCounts[index] > 0 }.keySet().sort()
		throw new GradleException("Cannot repair circular field dependencies in ${classTree.simpleName}: ${blockedFields.join(', ')}; no source files were written.")
	}
	repaired
}

def areFieldsInSameFormattingGroup = { left, right, Map importedTypesBySimpleName ->
	if (!(left.tree instanceof VariableTree) || !(right.tree instanceof VariableTree)) {
		return false
	}
	if (getVisibilitySortRank(left.tree) != getVisibilitySortRank(right.tree)
			|| hasModifier(left.tree, Modifier.STATIC) != hasModifier(right.tree, Modifier.STATIC)
			|| hasModifier(left.tree, Modifier.FINAL) != hasModifier(right.tree, Modifier.FINAL)) {
		return false
	}
	if (left.trees.any { it.initializer != null } != right.trees.any { it.initializer != null }) {
		return false
	}
	buildFieldTypeSortKey(left.tree, importedTypesBySimpleName) == buildFieldTypeSortKey(right.tree, importedTypesBySimpleName)
}

def joinFormattedMembers = { List sortedMemberUnits, List formattedMembers, Map importedTypesBySimpleName ->
	def joined = new StringBuilder()
	formattedMembers.eachWithIndex { formattedMember, index ->
		if (index > 0) {
			joined << (areFieldsInSameFormattingGroup(sortedMemberUnits[index - 1], sortedMemberUnits[index], importedTypesBySimpleName) ? "\n" : "\n\n")
		}
		joined << formattedMember
	}
	joined.toString()
}

def formatJavaClassDeclaration
formatJavaClassDeclaration = { ClassTree classTree, String source, Object compilationUnit, Object sourcePositions, Map importedTypesBySimpleName, String declarationIndent, List orderGroups, boolean orderOnly ->
	int classStart = sourcePositions.getStartPosition(compilationUnit, classTree) as int
	int classEnd = sourcePositions.getEndPosition(compilationUnit, classTree) as int
	if (classStart < 0 || classEnd <= classStart) {
		return source.substring(classStart, classEnd)
	}
	def classIndent = declarationIndent == null ? getLineIndentation(source, classStart) : declarationIndent

	if (classTree.kind.name() == "ENUM") {
		if (orderOnly) return source.substring(classStart, classEnd)
		return indentFirstLine(trimLeadingAndTrailingBlankLines(source.substring(classStart, classEnd)), classIndent)
	}

	def marker = findDeclarationBodyOrSemicolon(source, classStart, classEnd)
	if (marker == null || marker.marker != '{' as char) {
		if (orderOnly) return source.substring(classStart, classEnd)
		return indentFirstLine(trimLeadingAndTrailingBlankLines(source.substring(classStart, classEnd)), classIndent)
	}

	int openBrace = marker.index as int
	List recordParameterTypes = classTree.kind.name() == "RECORD" ? classTree.members.findAll { member ->
		member instanceof VariableTree && sourcePositions.getStartPosition(compilationUnit, member) < openBrace
	}.collect { buildQualifiedTypeSortName(it.type, importedTypesBySimpleName) } : null
	def header = orderOnly ? source.substring(classStart, openBrace + 1)
			: normalizeClassDeclarationHeader(source.substring(classStart, openBrace + 1), classIndent, recordParameterTypes, classTree.implementsClause.size())

	def membersInSourceOrder = []
	classTree.members.eachWithIndex { memberTree, originalIndex ->
		int start = sourcePositions.getStartPosition(compilationUnit, memberTree) as int
		int end = sourcePositions.getEndPosition(compilationUnit, memberTree) as int
		if (start > openBrace && end > start) {
			membersInSourceOrder << [tree: memberTree, trees: [memberTree], start: start, end: end, originalIndex: originalIndex]
		}
	}
	membersInSourceOrder.sort { left, right -> left.start <=> right.start }

	def memberUnits = []
	membersInSourceOrder.each { member ->
		def previousMemberUnit = memberUnits.isEmpty() ? null : memberUnits.last()
		if (previousMemberUnit != null
				&& member.tree instanceof VariableTree
				&& previousMemberUnit.tree instanceof VariableTree
				&& member.start < previousMemberUnit.end) {
			previousMemberUnit.trees << member.tree
			previousMemberUnit.end = Math.max(previousMemberUnit.end as int, member.end as int)
		} else {
			memberUnits << member
		}
	}

	if (memberUnits.isEmpty()) {
		if (orderOnly) return source.substring(classStart, classEnd)
		def body = source.substring(openBrace + 1, classEnd - 1)
		return body.trim().isEmpty() ? "${header.substring(0, header.length() - 1)}{}" : indentFirstLine(source.substring(classStart, classEnd), classIndent)
	}

	// Partition source ranges once in source order. A declaration never owns any
	// preceding declaration, including when several declarations share a line.
	int previousEnd = openBrace + 1
	memberUnits.eachWithIndex { member, index ->
		String gap = source.substring(previousEnd, member.start as int)
		member.leading = gap
		member.trailing = ""
		if (index > 0) {
			int cursor = previousEnd
			while (cursor < member.start) {
				def token = scanNextImportOrComment(source, cursor)
				if (token == null || token.kind != "comment" || token.text.startsWith("/**") || token.end > member.start
						|| source.substring(cursor, token.start as int).contains("\n")) {
					break
				}
				memberUnits[index - 1].trailing += source.substring(cursor, token.end as int)
				cursor = token.end as int
			}
			member.leading = source.substring(cursor, member.start as int)
		}
		previousEnd = member.end as int
	}
	String trailingBody = source.substring(previousEnd, classEnd - 1)
	int trailingCursor = previousEnd
	while (trailingCursor < classEnd - 1) {
		def token = scanNextImportOrComment(source, trailingCursor)
		if (token == null || token.kind != "comment" || token.text.startsWith("/**") || token.end > classEnd - 1
				|| source.substring(trailingCursor, token.start as int).contains("\n")) {
			break
		}
		memberUnits.last().trailing += source.substring(trailingCursor, token.end as int)
		trailingCursor = token.end as int
	}
	trailingBody = source.substring(trailingCursor, classEnd - 1)

	Map firstInvocationOrderByMethodName = orderOnly ? collectMethodFirstInvocationOrder.call(classTree, sourcePositions, compilationUnit) as Map : [:]
	def buildMemberSortKey = { memberUnit ->
		def tree = memberUnit.tree
		int groupIndex = findMemberOrderGroupIndex(tree, orderGroups)
		def group = orderGroups[groupIndex]
		def values = [:]
		List sortKey = [groupIndex]
		if (tree instanceof VariableTree) {
			def fieldNames = memberUnit.trees.collect { it.name.toString() }
			List fieldTypeKey = buildFieldTypeSortKey(tree, importedTypesBySimpleName) as List
			// Both initialization state and explicit type priority are configurable sort keys.
			def configuredTypes = group.fieldTypes.collect { buildQualifiedTypeSortName(it, importedTypesBySimpleName) }
			int typeRank = configuredTypes.indexOf(fieldTypeKey[1])
			values = [initialized: memberUnit.trees.any { it.initializer != null } ? 1 : 0,
					typeOrder: typeRank < 0 ? configuredTypes.size() : typeRank,
					typeLength: fieldTypeKey[0], typeName: fieldTypeKey[1], name: fieldNames.first(), names: fieldNames.join(",")]
		} else if (tree instanceof MethodTree) {
			def methodName = tree.name.toString()
			values = [name: methodName, parameterCount: tree.parameters.size(),
					parameterTypes: buildParameterTypeSortKey(tree, importedTypesBySimpleName),
					firstInvocation: firstInvocationOrderByMethodName.containsKey(methodName) ? firstInvocationOrderByMethodName[methodName] : Integer.MAX_VALUE]
		} else if (tree instanceof ClassTree) {
			values = [name: tree.simpleName.toString()]
		}
		sortKey.addAll(group.sortBy.collect { values[it] })
		sortKey << memberUnit.originalIndex
		sortKey
	}

	def sortedMemberUnits = orderOnly
			? repairFieldDependencyOrder.call(sortJavaMembers.call(memberUnits, buildMemberSortKey), classTree)
			: memberUnits
	if (orderOnly) {
		// Move intact declarations and their attached comments/whitespace. Structural
		// formatting is reserved for structJavaBody; only protect line-comment boundaries.
		def endsWithLineComment = { String comments ->
			def tokens = comments =~ /\/\*[\s\S]*?\*\/|\/\/[^\r\n]*/
			String lastComment = ""
			while (tokens.find()) lastComment = tokens.group()
			lastComment.startsWith("//")
		}
		def orderedBody = new StringBuilder()
		sortedMemberUnits.eachWithIndex { member, int index ->
			if (index > 0 && endsWithLineComment(sortedMemberUnits[index - 1].trailing as String)
					&& !((member.leading as String) ==~ /[ \t\r]*\n[\s\S]*/)) orderedBody << "\n"
			String declaration = member.tree instanceof ClassTree
					? formatJavaClassDeclaration.call(member.tree as ClassTree, source, compilationUnit, sourcePositions, importedTypesBySimpleName, null, orderGroups, true)
					: source.substring(member.start as int, member.end as int)
			orderedBody << member.leading << declaration << member.trailing
		}
		if (endsWithLineComment(sortedMemberUnits.last().trailing as String)
				&& !(trailingBody ==~ /[ \t\r]*\n[\s\S]*/)) orderedBody << "\n"
		return header + orderedBody.toString() + trailingBody + "}"
	}
	def formattedMembers = sortedMemberUnits.collect { memberUnit ->
		def tree = memberUnit.tree
		String leading = trimLeadingAndTrailingBlankLines(memberUnit.leading as String)
		String prefix = leading.trim().isEmpty() ? "" : leading + "\n"
		String memberIndent = "${classIndent}${javaMemberIndentation}"
		String memberSourceText = memberIndent + source.substring(memberUnit.start as int, memberUnit.end as int)
		String formattedMember
		if (tree instanceof ClassTree) {
			formattedMember = formatJavaClassDeclaration.call(
					tree as ClassTree, source, compilationUnit, sourcePositions, importedTypesBySimpleName, "${classIndent}${javaMemberIndentation}", orderGroups, false
			)
		} else if (tree instanceof MethodTree) {
			List parameterTypes = ([tree.receiverParameter] + tree.parameters).findAll { it != null }
					.collect { buildQualifiedTypeSortName(it.type, importedTypesBySimpleName) }
			formattedMember = normalizeMethodOrConstructorBlock(memberSourceText, parameterTypes)
		} else {
			formattedMember = normalizeFieldOrInitializerBlock(memberSourceText)
		}
		prefix + formattedMember + memberUnit.trailing
	}

	def tail = trimLeadingAndTrailingBlankLines(trailingBody)
	"${header}\n\n${joinFormattedMembers(sortedMemberUnits, formattedMembers, importedTypesBySimpleName)}${tail.trim().isEmpty() ? '' : '\n' + tail}\n\n${classIndent}}"
}

def normalizeJavaFileDeclarations = { File sourceFile, boolean checkOnly, String inputSource, List orderGroups, boolean orderOnly ->
	def originalSourceText = inputSource == null ? sourceFile.getText("UTF-8") : inputSource
	def lineSeparator = originalSourceText.contains("\r\n") ? "\r\n" : "\n"
	def sourceWithLfLineEndings = originalSourceText.replace("\r\n", "\n")
	def parsedSource = parseJavaCompilationUnit(sourceFile, sourceWithLfLineEndings)
	if (parsedSource == null) {
		return inputSource == null ? false : originalSourceText
	}

	def importedTypesBySimpleName = collectImportedTypeNames(sourceWithLfLineEndings)
	def replacements = []
	List<ClassTree> typeDeclarationsToFormat = parsedSource.unit.typeDecls.findAll { typeDeclaration ->
		typeDeclaration instanceof ClassTree && !shouldSkipJavaDeclarationFormatting(typeDeclaration, parsedSource.unit)
	}.collect { it as ClassTree }
	typeDeclarationsToFormat.each { ClassTree classTree ->
		int start = parsedSource.positions.getStartPosition(parsedSource.unit, classTree) as int
		int end = parsedSource.positions.getEndPosition(parsedSource.unit, classTree) as int
		if (start >= 0 && end > start) {
			int lineStart = findLineStart(sourceWithLfLineEndings, start) as int
			int replacementStart = !orderOnly && sourceWithLfLineEndings.substring(lineStart, start).trim().isEmpty() ? lineStart : start
			replacements << [
					start: replacementStart,
					end: end,
					text: formatJavaClassDeclaration.call(classTree, sourceWithLfLineEndings, parsedSource.unit, parsedSource.positions, importedTypesBySimpleName, "", orderGroups, orderOnly)
			]
		}
	}

	def formattedSourceWithLfLineEndings = new StringBuilder(sourceWithLfLineEndings)
	replacements.sort { left, right -> right.start <=> left.start }.each { replacement ->
		formattedSourceWithLfLineEndings.replace(replacement.start as int, replacement.end as int, replacement.text as String)
	}

	def formattedSourceText = formattedSourceWithLfLineEndings.toString().replace("\n", lineSeparator)
	if (originalSourceText.endsWith("\n") || originalSourceText.endsWith("\r\n")) {
		formattedSourceText = formattedSourceText.replaceAll(/(\r?\n)*$/, "") + lineSeparator
	}
	if (inputSource != null) {
		return formattedSourceText
	}
	if (formattedSourceText == originalSourceText) {
		return false
	}
	if (!checkOnly) {
		sourceFile.write(formattedSourceText, "UTF-8")
	}
	true
}

def buildJavaStructureFingerprint
buildJavaStructureFingerprint = { tree, boolean preserveMemberOrder = false ->
	if (!(tree instanceof ClassTree)) {
		return [tree.kind.name(), tree.toString()]
	}
	def members = tree.members.collect { buildJavaStructureFingerprint(it, preserveMemberOrder) }
	// Field initialization order intentionally follows the configured sort keys.
	// Initializer blocks still retain their relative order and original contents.
	def initializerBlockOrder = tree.members.findAll { member ->
		member.kind.name() == "BLOCK"
	}.collect { buildJavaStructureFingerprint(it) }
	[tree.kind.name(), tree.simpleName.toString(), tree.modifiers.toString(), tree.typeParameters.toString(),
	 tree.extendsClause?.toString(), tree.implementsClause.toString(), tree.permitsClause.toString(),
	 preserveMemberOrder ? members : members.sort { left, right -> left.toString() <=> right.toString() }, initializerBlockOrder]
}

def collectJavaComments = { String source ->
	// Consume literals as whole tokens before considering comment delimiters.
	def tokens = source =~ /"""(?:\\[\s\S]|"(?!"")|[^"\\])*"""|"(?:\\[\s\S]|[^"\\])*"|'(?:\\[\s\S]|[^'\\])*'|(\/\*[\s\S]*?\*\/|\/\/[^\r\n]*)/
	def comments = []
	while (tokens.find()) {
		if (tokens.group(1) != null) {
			comments << tokens.group(1)
		}
	}
	comments.sort()
}

tasks.register("formatJavaHead") {
	group = "formatting"
	description = "Normalizes Java license headers, package spacing, and import comment groups under src."
	inputs.files(javaSourceFiles)
	inputs.file(importGroupsConfigFile)
	outputs.upToDateWhen { false }

	doLast {
		List importGroups = loadImportGroupDefinitions() as List
		javaSourceFiles.each { File sourceFile ->
			normalizeJavaFileHeaderAndImports(sourceFile, importGroups, false)
		}
	}
}

def rewriteJavaBodyFiles = { String taskName, boolean orderOnly ->
	List orderGroups = orderOnly ? loadJavaDeclarationOrder() as List : null
	// Validate every file before either task writes any source files.
	def pendingWrites = [:]
	javaSourceFiles.files.sort { project.relativePath(it) }.each { File sourceFile ->
		String original = sourceFile.getText("UTF-8")
		// Only structJavaBody may remove comments between adjacent annotations.
		String prepared = orderOnly ? original : mergeConsecutiveAnnotationLines(sourceFile, true, original) as String
		def rewrite = { String source ->
			String input = orderOnly ? source : mergeConsecutiveAnnotationLines(sourceFile, true, source) as String
			normalizeJavaFileDeclarations(sourceFile, true, input, orderGroups, orderOnly) as String
		}
		String rewritten = normalizeJavaFileDeclarations(sourceFile, true, prepared, orderGroups, orderOnly) as String
		def before = parseJavaCompilationUnit(sourceFile, original)
		def after = parseJavaCompilationUnit(sourceFile, rewritten)
		if (before.unit.typeDecls.collect { buildJavaStructureFingerprint(it, !orderOnly) } != after.unit.typeDecls.collect { buildJavaStructureFingerprint(it, !orderOnly) }
				|| collectJavaComments(prepared) != collectJavaComments(rewritten)) {
			throw new GradleException("${taskName} would change Java structure, protected declaration order, or comments in ${sourceFile}; no source files were written.")
		}
		if (rewrite(rewritten) != rewritten) {
			throw new GradleException("${taskName} did not converge for ${sourceFile}; no source files were written.")
		}
		if (rewritten != original) pendingWrites[sourceFile] = rewritten
	}
	pendingWrites.each { File sourceFile, String rewritten -> sourceFile.write(rewritten, "UTF-8") }
}

tasks.register("orderJavaBody") {
	group = "formatting"
	description = "Sorts Java declarations by configured order, then repairs field dependency order under src."
	inputs.files(javaSourceFiles)
	inputs.file(declarationOrderConfigFile)
	outputs.upToDateWhen { false }
	mustRunAfter(tasks.named("formatJavaHead"))

	doLast {
		rewriteJavaBodyFiles("orderJavaBody", true)
	}
}

tasks.register("structJavaBody") {
	group = "formatting"
	description = "Merges Java annotations and normalizes declaration layout without reordering members under src."
	inputs.files(javaSourceFiles)
	outputs.upToDateWhen { false }
	mustRunAfter(tasks.named("formatJavaHead"), tasks.named("orderJavaBody"))

	doLast {
		rewriteJavaBodyFiles("structJavaBody", false)
	}
}

tasks.register("checkJavaImportGroups") {
	group = "verification"
	description = "Checks Java license headers, package spacing, and import comment groups under src."
	inputs.files(javaSourceFiles)
	inputs.file(importGroupsConfigFile)

	doLast {
		List importGroups = loadImportGroupDefinitions() as List
		def filesWithUnnormalizedHeaders = javaSourceFiles.findAll { File sourceFile ->
			normalizeJavaFileHeaderAndImports(sourceFile, importGroups, true)
		}
		if (!filesWithUnnormalizedHeaders.isEmpty()) {
			throw new GradleException("Java file heads are not normalized. Run ./gradlew formatJavaHead. Files: ${filesWithUnnormalizedHeaders.join(", ")}")
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.dependsOn(tasks.named("formatJavaHead"))
	it.dependsOn(tasks.named("orderJavaBody"))
	it.dependsOn(tasks.named("structJavaBody"))
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

def archiveProjectName = project.name
jar {
	inputs.property "projectName", archiveProjectName
	from("LICENSE") {
		rename { "${it}_${archiveProjectName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
