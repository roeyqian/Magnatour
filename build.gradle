def extractImportMap = { String source ->
    def imports = [:]
    source.readLines().each { line ->
        def matcher = line =~ /^\s*import\s+(?!static)([\w.]+)\.([A-Za-z_$][\w$]*);\s*$/
        if (matcher.matches()) {
            imports[matcher.group(2)] = "${matcher.group(1)}.${matcher.group(2)}"
        }
    }
    imports
}

def normalizeTypeSortName = { Object typeTree, Map importMap ->
    if (typeTree == null) {
        return ""
    }
    def text = typeTree.toString()
    text = text.replaceAll(/@\s*[\w.]+(\s*\([^)]*\))?\s*/, "")
    text = text.replace("...", "[]")
    text = text.replaceAll(/\s+/, "")
    text.replaceAll(/\b([A-Z][A-Za-z0-9_$]*)\b/) { full, simpleName ->
        if (importMap.containsKey(simpleName)) {
            return importMap[simpleName]
        }
        if (javaLangTypes.contains(simpleName)) {
            return "java.lang.${simpleName}"
        }
        simpleName
    }
}

def parameterTypeKey = { MethodTree methodTree, Map importMap ->
    methodTree.parameters.collect { parameter ->
        normalizeTypeSortName(parameter.type, importMap)
    }.join(",")
}

def fieldTypeSortKey = { VariableTree variableTree, Map importMap ->
    def typeName = normalizeTypeSortName(variableTree.type, importMap)
    [typeName.length(), typeName]
}

def hasModifier = { tree, Modifier modifier ->
    tree.modifiers.flags.contains(modifier)
}

def isUtilityRegistryPackage = { Object compilationUnit ->
    def packageName = compilationUnit.packageName?.toString()
    if (packageName == null) {
        return false
    }

    packageName == "utility.registry"
            || packageName.endsWith(".utility.registry")
            || packageName.contains(".utility.registry.")
}

def shouldSkipJavaDeclarationFormatting = { ClassTree classTree, Object compilationUnit ->
    if (!isUtilityRegistryPackage(compilationUnit)) {
        return false
    }

    // Registry holders and packet records are hand-grouped; keep their member order untouched.
    def kindName = classTree.kind.name()
    boolean finalClass = kindName == "CLASS" && hasModifier(classTree, Modifier.FINAL)
    boolean recordClass = kindName == "RECORD"
    finalClass || recordClass
}

def declarationVisibilityRank = { tree ->
    if (hasModifier(tree, Modifier.PUBLIC)) {
        return 0
    }
    if (hasModifier(tree, Modifier.PROTECTED)) {
        return 1
    }
    if (hasModifier(tree, Modifier.PRIVATE)) {
        return 2
    }
    3
}

def fieldCategoryRank = { VariableTree tree ->
    boolean staticMember = hasModifier(tree, Modifier.STATIC)
    switch (declarationVisibilityRank(tree)) {
        case 0:
            return staticMember ? 0 : 1
        case 1:
            return staticMember ? 2 : 3
        case 2:
            return staticMember ? 4 : 5
        default:
            return staticMember ? 4 : 5
    }
}

def methodCategoryRank = { MethodTree tree ->
    boolean staticMember = hasModifier(tree, Modifier.STATIC)
    switch (declarationVisibilityRank(tree)) {
        case 0:
            return staticMember ? 7 : 8
        case 1:
            return staticMember ? 9 : 10
        case 2:
            return staticMember ? 11 : 12
        default:
            return staticMember ? 11 : 12
    }
}

def collectPrivateMethodCallOrder = { ClassTree classTree, Object positions, Object compilationUnit ->
    def calls = [:]
    int[] nextOrder = [0] as int[]
    def scanner = new TreeScanner<Void, Void>() {
        @Override
        Void visitClass(ClassTree nestedClassTree, Void unused) {
            if (nestedClassTree == classTree) {
                super.visitClass(nestedClassTree, unused)
            }
            return null
        }

        @Override
        Void visitMethodInvocation(MethodInvocationTree invocationTree, Void unused) {
            def selected = invocationTree.methodSelect
            def name = selected instanceof MemberSelectTree
                    ? selected.identifier.toString()
                    : selected instanceof IdentifierTree ? selected.name.toString() : selected.toString()
            if (!calls.containsKey(name)) {
                calls[name] = nextOrder[0]++
            }
            super.visitMethodInvocation(invocationTree, unused)
            return null
        }
    }

    classTree.members.findAll { !(it instanceof ClassTree) }.each { scanner.scan(it, null) }
    calls
}

def compareSortKeys = { List left, List right ->
    int max = Math.max(left.size(), right.size())
    for (int index = 0; index < max; index++) {
        def leftValue = index < left.size() ? left[index] : null
        def rightValue = index < right.size() ? right[index] : null
        if (leftValue == rightValue) {
            continue
        }
        if (leftValue == null) {
            return -1
        }
        if (rightValue == null) {
            return 1
        }
        int compared = leftValue <=> rightValue
        if (compared != 0) {
            return compared
        }
    }
    0
}

def collectFieldInitializerReferences = { unit ->
    def references = [] as Set
    def scanner = new TreeScanner<Void, Void>() {
        @Override
        Void visitIdentifier(IdentifierTree identifierTree, Void unused) {
            references << identifierTree.name.toString()
            super.visitIdentifier(identifierTree, unused)
            return null
        }
    }

    unit.trees.findAll { it instanceof VariableTree }.each { VariableTree variableTree ->
        if (variableTree.initializer != null) {
            scanner.scan(variableTree.initializer, null)
        }
    }
    references
}

def sortMemberUnits = { List units, Closure memberSortKey ->
    Map<String, Integer> fieldOwnerByName = [:]
    units.eachWithIndex { unit, int index ->
        if (unit.tree instanceof VariableTree) {
            unit.trees.each { fieldOwnerByName[it.name.toString()] = index as Integer }
        }
    }

    List<Integer> unitIndexes = (0..<units.size()).collect { it as Integer }
    Map<Integer, Set<Integer>> outgoing = unitIndexes.collectEntries { Integer unitIndex ->
        [(unitIndex): new LinkedHashSet<Integer>()]
    } as Map<Integer, Set<Integer>>
    Map<Integer, Integer> indegree = unitIndexes.collectEntries { Integer unitIndex -> [(unitIndex): 0] } as Map<Integer, Integer>
    units.eachWithIndex { unit, int index ->
        if (unit.tree instanceof VariableTree) {
            collectFieldInitializerReferences.call(unit).each { name ->
                Integer dependency = fieldOwnerByName[name as String]
                if (dependency != null && dependency != index && outgoing[dependency].add(index as Integer)) {
                    indegree[index] = indegree[index] + 1
                }
            }
        }
    }

    List sorted = []
    List<Integer> available = unitIndexes.findAll { Integer unitIndex -> indegree[unitIndex] == 0 }
    Set<Integer> remaining = unitIndexes as Set<Integer>
    while (!available.isEmpty()) {
        available.sort { Integer left, Integer right ->
            compareSortKeys.call(memberSortKey.call(units[left]) as List, memberSortKey.call(units[right]) as List) as int
        }
        Integer selected = available.remove(0)
        if (!remaining.remove(selected)) {
            continue
        }
        sorted << units[selected]
        outgoing[selected].each { Integer next ->
            indegree[next] = indegree[next] - 1
            if (indegree[next] == 0 && remaining.contains(next)) {
                available.add(next)
            }
        }
    }

    if (!remaining.isEmpty()) {
        sorted.addAll(remaining.collect { Integer unitIndex -> units[unitIndex] }.sort { left, right ->
            compareSortKeys.call(memberSortKey.call(left) as List, memberSortKey.call(right) as List) as int
        })
    }
    sorted
}

def sameFieldGroup = { left, right, Map importMap ->
    if (!(left.tree instanceof VariableTree) || !(right.tree instanceof VariableTree)) {
        return false
    }
    if (fieldCategoryRank(left.tree) != fieldCategoryRank(right.tree)) {
        return false
    }
    fieldTypeSortKey(left.tree, importMap) == fieldTypeSortKey(right.tree, importMap)
}

def joinFormattedMembers = { List sortedUnits, List formattedMembers, Map importMap ->
    def joined = new StringBuilder()
    formattedMembers.eachWithIndex { formattedMember, index ->
        if (index > 0) {
            joined << (sameFieldGroup(sortedUnits[index - 1], sortedUnits[index], importMap) ? "\n" : "\n\n")
        }
        joined << formattedMember
    }
    joined.toString()
}

def formatJavaClassDeclaration
formatJavaClassDeclaration = { ClassTree classTree, String source, Object compilationUnit, Object positions, Map importMap, String declarationIndent ->
    int classStart = positions.getStartPosition(compilationUnit, classTree) as int
    int classEnd = positions.getEndPosition(compilationUnit, classTree) as int
    if (classStart < 0 || classEnd <= classStart) {
        return source.substring(classStart, classEnd)
    }
    def classIndent = declarationIndent == null ? lineIndentAt(source, classStart) : declarationIndent

    if (classTree.kind.name() == "ENUM") {
        return indentFirstLine(trimBlankEdges(source.substring(classStart, classEnd)), classIndent)
    }

    def marker = findDeclarationMarker(source, classStart, classEnd)
    if (marker == null || marker.marker != '{' as char) {
        return indentFirstLine(trimBlankEdges(source.substring(classStart, classEnd)), classIndent)
    }

    int openBrace = marker.index as int
    def header = normalizeClassDeclarationHeader(source.substring(classStart, openBrace + 1), classIndent)

    def rawMembers = []
    classTree.members.eachWithIndex { memberTree, originalIndex ->
        int start = positions.getStartPosition(compilationUnit, memberTree) as int
        int end = positions.getEndPosition(compilationUnit, memberTree) as int
        if (start > openBrace && end > start) {
            rawMembers << [tree: memberTree, trees: [memberTree], start: start, end: end, originalIndex: originalIndex]
        }
    }
    rawMembers.sort { left, right -> left.start <=> right.start }

    def units = []
    rawMembers.each { member ->
        def previous = units.isEmpty() ? null : units.last()
        if (previous != null
                && member.tree instanceof VariableTree
                && previous.tree instanceof VariableTree
                && member.start < previous.end) {
            previous.trees << member.tree
            previous.end = Math.max(previous.end as int, member.end as int)
        } else {
            units << member
        }
    }

    if (units.isEmpty()) {
        return "${header.substring(0, header.length() - 1)}{}"
    }

    Map callOrder = collectPrivateMethodCallOrder.call(classTree, positions, compilationUnit) as Map
    def memberSortKey = { unit ->
        def tree = unit.tree
        if (tree instanceof VariableTree) {
            def names = unit.trees.collect { it.name.toString() }
            def typeKey = fieldTypeSortKey(tree, importMap)
            return [fieldCategoryRank(tree), 0, typeKey[0], typeKey[1], names.first(), names.join(","), unit.originalIndex]
        }
        if (tree instanceof MethodTree) {
            def name = tree.name.toString()
            if (name == "<init>") {
                return [6, 1, tree.parameters.size(), parameterTypeKey(tree, importMap), unit.originalIndex]
            }
            List<Object> base = new ArrayList<Object>([methodCategoryRank(tree), 0])
            if (hasModifier(tree, Modifier.PRIVATE) || declarationVisibilityRank(tree) == 3) {
                base.add(callOrder.containsKey(name) ? callOrder[name] : Integer.MAX_VALUE)
            }
            base.addAll([name, tree.parameters.size(), parameterTypeKey(tree, importMap), unit.originalIndex])
            return base
        }
        if (tree instanceof ClassTree) {
            return [13, 0, tree.simpleName.toString(), unit.originalIndex]
        }
        [6, 0, unit.originalIndex]
    }

    def sortedUnits = sortMemberUnits.call(units, memberSortKey)
    int lowerBound = openBrace + 1
    def formattedMembers = sortedUnits.collect { unit ->
        int leadingStart = includeLeadingDeclarationTrivia(source, lowerBound, unit.start as int)
        def tree = unit.tree
        if (tree instanceof ClassTree) {
            return formatJavaClassDeclaration.call(
                    tree as ClassTree, source, compilationUnit, positions, importMap, "${classIndent}${javaMemberIndent}"
            )
        }
        def block = source.substring(leadingStart, unit.end as int)
        if (tree instanceof MethodTree) {
            return normalizeMethodOrConstructorBlock(block)
        }
        normalizeFieldOrInitializerBlock(block)
    }

    "${header}\n\n${joinFormattedMembers(sortedUnits, formattedMembers, importMap)}\n\n${classIndent}}"
}

def formatJavaDeclarations = { File sourceFile, boolean checkOnly ->
    def original = sourceFile.getText("UTF-8")
    def newline = original.contains("\r\n") ? "\r\n" : "\n"
    def normalizedOriginal = original.replace("\r\n", "\n")
    def parsed = parseJavaSource(sourceFile, normalizedOriginal)
    if (parsed == null) {
        return false
    }

    def importMap = extractImportMap(normalizedOriginal)
    def replacements = []
    // Leave selected utility.registry declarations out of member sorting.
    List<ClassTree> typeDeclsToFormat = parsed.unit.typeDecls.findAll { typeDecl ->
        typeDecl instanceof ClassTree && !shouldSkipJavaDeclarationFormatting(typeDecl, parsed.unit)
    }.collect { it as ClassTree }
    typeDeclsToFormat.each { ClassTree classTree ->
        int start = parsed.positions.getStartPosition(parsed.unit, classTree) as int
        int end = parsed.positions.getEndPosition(parsed.unit, classTree) as int
        if (start >= 0 && end > start) {
            replacements << [
                    start: start,
                    end: end,
                    text: formatJavaClassDeclaration.call(classTree, normalizedOriginal, parsed.unit, parsed.positions, importMap, null)
            ]
        }
    }

    def rewrittenNormalized = new StringBuilder(normalizedOriginal)
    replacements.sort { left, right -> right.start <=> left.start }.each { replacement ->
        rewrittenNormalized.replace(replacement.start as int, replacement.end as int, replacement.text as String)
    }

    def rewritten = rewrittenNormalized.toString().replace("\n", newline)
    if (original.endsWith("\n") || original.endsWith("\r\n")) {
        rewritten = rewritten.replaceAll(/(\r?\n)*$/, "") + newline
    }
    if (rewritten == original) {
        return false
    }
    if (!checkOnly) {
        sourceFile.write(rewritten, "UTF-8")
    }
    true
}

tasks.register("formatJavaImports") {
    group = "formatting"
    description = "Normalizes Java import comment groups under src."
    inputs.files(javaSourceFiles)
    inputs.file(importGroupConfigFile)
    outputs.upToDateWhen { false }

    doLast {
        List groups = loadImportGroups() as List
        javaSourceFiles.each { File sourceFile ->
            rewriteJavaImports(sourceFile, groups, false)
            ensureSpdxHeader(sourceFile)
        }
    }
}

tasks.register("formatJavaAnnotations") {
    group = "formatting"
    description = "Merges consecutive Java annotation lines under src."
    inputs.files(javaSourceFiles)
    outputs.upToDateWhen { false }

    doLast {
        javaSourceFiles.each { File sourceFile ->
            rewriteJavaAnnotations(sourceFile, false)
        }
    }
}

tasks.register("formatJavaDeclarations") {
    group = "formatting"
    description = "Sorts and normalizes Java declarations under src."
    inputs.files(javaSourceFiles)
    outputs.upToDateWhen { false }

    doLast {
        javaSourceFiles.each { File sourceFile ->
            formatJavaDeclarations(sourceFile, false)
        }
    }
}

tasks.register("checkJavaImportGroups") {
    group = "verification"
    description = "Checks Java import comment groups under src."
    inputs.files(javaSourceFiles)
    inputs.file(importGroupConfigFile)

    doLast {
        List groups = loadImportGroups() as List
        def changed = javaSourceFiles.findAll { File sourceFile ->
            rewriteJavaImports(sourceFile, groups, true)
        }
        if (!changed.isEmpty()) {
            throw new GradleException("Java import groups are not normalized. Run ./gradlew formatJavaImports. Files: ${changed.join(", ")}")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.dependsOn(tasks.named("formatJavaImports"))
    it.dependsOn(tasks.named("formatJavaAnnotations"))
    it.dependsOn(tasks.named("formatJavaDeclarations"))
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "projectName", project.name
    from("LICENSE") {
        rename { "${it}_${project.name}"}
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
