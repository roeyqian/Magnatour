def spdxHeaderStartsWith = "/*\n * SPDX-License-Identifier: GPL-3.0-or-later"

def initClassFileNames = ["Magnatour.java", "MagnatourClient.java"] as Set

def ensureSpdxHeader = { File sourceFile ->
    if (initClassFileNames.contains(sourceFile.name)) {
        return false
    }

    def original = sourceFile.getText("UTF-8")
    def normalized = original.replace("\r\n", "\n")
    if (normalized.startsWith(spdxHeaderStartsWith)) {
        return false
    }

    def newline = original.contains("\r\n") ? "\r\n" : "\n"
    def header = spdxHeaderText.replace("\n", newline)
    def rewritten = header + newline + original

    sourceFile.write(rewritten, "UTF-8")
    return true
}

def rewriteJavaAnnotations = { File sourceFile, boolean checkOnly ->
    def original = sourceFile.getText("UTF-8")
    def newline = original.contains("\r\n") ? "\r\n" : "\n"
    def lines = original.readLines()
    def rewrittenLines = []

    for (def index = 0; index < lines.size();) {
        def current = parseCompleteAnnotationLine(lines[index])
        if (current == null) {
            rewrittenLines << lines[index]
            index++
            continue
        }

        def annotations = [current.text]
        def nextIndex = index + 1
        while (nextIndex < lines.size()) {
            def next = parseCompleteAnnotationLine(lines[nextIndex])
            if (next == null || next.indent != current.indent) {
                break
            }
            annotations << next.text
            nextIndex++
        }

        if (annotations.size() > 1) {
            rewrittenLines << "${current.indent}${annotations.join(" ")}"
            index = nextIndex
        } else {
            rewrittenLines << lines[index]
            index++
        }
    }

    def rewritten = rewrittenLines.join(newline)
    if (original.endsWith("\n") || original.endsWith("\r\n")) {
        rewritten += newline
    }
    if (rewritten == original) {
        return false
    }
    if (!checkOnly) {
        sourceFile.write(rewritten, "UTF-8")
    }
    true
}

def newStringJavaFileObject = { File sourceFile, String source ->
    new SimpleJavaFileObject(sourceFile.toURI(), JavaFileObject.Kind.SOURCE) {
        @Override
        CharSequence getCharContent(boolean ignoreEncodingErrors) {
            source
        }
    }
}

def parseJavaSource = { File sourceFile, String source ->
    def compiler = ToolProvider.systemJavaCompiler
    if (compiler == null) {
        throw new GradleException("formatJavaDeclarations requires Gradle to run on a JDK, not a JRE.")
    }

    def diagnostics = new DiagnosticCollector<JavaFileObject>()
    def task = compiler.getTask(
            null,
            null,
            diagnostics,
            ["-proc:none"],
            null,
            [newStringJavaFileObject(sourceFile, source)]
    ) as JavacTask
    def units = task.parse().toList()
    def errors = diagnostics.diagnostics.findAll { it.kind == Diagnostic.Kind.ERROR }
    if (!errors.isEmpty()) {
        throw new GradleException("Unable to parse ${sourceFile}: ${errors.collect { it.getMessage(Locale.ROOT) }.join("; ")}")
    }
    if (units.isEmpty()) {
        return null
    }

    [unit: units.first(), positions: Trees.instance(task).sourcePositions]
}

def lineStartAt = { String source, int index ->
    int cursor = Math.max(0, Math.min(index, source.length()))
    while (cursor > 0 && source.charAt(cursor - 1) != '\n' as char && source.charAt(cursor - 1) != '\r' as char) {
        cursor--
    }
    cursor
}

def previousLineStart = { String source, int lineStart ->
    if (lineStart <= 0) {
        return 0
    }
    int cursor = lineStart - 1
    if (cursor > 0 && source.charAt(cursor) == '\n' as char && source.charAt(cursor - 1) == '\r' as char) {
        cursor--
    }
    while (cursor > 0 && source.charAt(cursor - 1) != '\n' as char && source.charAt(cursor - 1) != '\r' as char) {
        cursor--
    }
    cursor
}

def lineIndentAt = { String source, int index ->
    int start = lineStartAt(source, index)
    int cursor = start
    while (cursor < source.length()) {
        def c = source.charAt(cursor)
        if (c != ' ' as char && c != '\t' as char) {
            break
        }
        cursor++
    }
    source.substring(start, cursor)
}

def includeLeadingDeclarationTrivia = { String source, int lowerBound, int declarationStart ->
    int cursor = lineStartAt(source, declarationStart)
    while (cursor > lowerBound) {
        int prevStart = previousLineStart(source, cursor)
        def line = source.substring(prevStart, cursor)
        def trimmed = line.trim()
        if (trimmed.isEmpty()
                || trimmed.startsWith("//")
                || trimmed.startsWith("/*")
                || trimmed.startsWith("*")
                || trimmed.endsWith("*/")) {
            cursor = prevStart
            continue
        }
        break
    }
    Math.max(cursor, lowerBound)
}

def trimBlankEdges = { String text ->
    def lines = text.readLines()
    int start = 0
    int end = lines.size()
    while (start < end && lines[start].trim().isEmpty()) {
        start++
    }
    while (end > start && lines[end - 1].trim().isEmpty()) {
        end--
    }
    lines.subList(start, end).join("\n")
}

def findDeclarationMarker = { String text, int start, int end ->
    boolean inLineComment = false
    boolean inBlockComment = false
    boolean inString = false
    boolean inChar = false
    boolean escaping = false
    int parenDepth = 0
    int bracketDepth = 0

    for (int index = start; index < end; index++) {
        char c = text.charAt(index)
        char next = index + 1 < end ? text.charAt(index + 1) : (char) 0

        if (inLineComment) {
            if (c == '\n' as char || c == '\r' as char) {
                inLineComment = false
            }
            continue
        }
        if (inBlockComment) {
            if (c == '*' as char && next == '/' as char) {
                inBlockComment = false
                index++
            }
            continue
        }
        if (escaping) {
            escaping = false
            continue
        }
        if (inString) {
            if (c == '\\' as char) {
                escaping = true
            } else if (c == '"' as char) {
                inString = false
            }
            continue
        }
        if (inChar) {
            if (c == '\\' as char) {
                escaping = true
            } else if (c == "'" as char) {
                inChar = false
            }
            continue
        }

        if (c == '/' as char && next == '/' as char) {
            inLineComment = true
            index++
        } else if (c == '/' as char && next == '*' as char) {
            inBlockComment = true
            index++
        } else if (c == '"' as char) {
            inString = true
        } else if (c == "'" as char) {
            inChar = true
        } else if (c == '(' as char) {
            parenDepth++
        } else if (c == ')' as char) {
            parenDepth = Math.max(0, parenDepth - 1)
        } else if (c == '[' as char) {
            bracketDepth++
        } else if (c == ']' as char) {
            bracketDepth = Math.max(0, bracketDepth - 1)
        } else if ((c == '{' as char || c == ';' as char) && parenDepth == 0 && bracketDepth == 0) {
            return [index: index, marker: c]
        }
    }
    null
}

def findLastTopLevelParenPair = { String text, int start, int end ->
    boolean inLineComment = false
    boolean inBlockComment = false
    boolean inString = false
    boolean inChar = false
    boolean escaping = false
    int depth = 0
    int currentOpen = -1
    def lastPair = null

    for (int index = start; index < end; index++) {
        char c = text.charAt(index)
        char next = index + 1 < end ? text.charAt(index + 1) : (char) 0

        if (inLineComment) {
            if (c == '\n' as char || c == '\r' as char) {
                inLineComment = false
            }
            continue
        }
        if (inBlockComment) {
            if (c == '*' as char && next == '/' as char) {
                inBlockComment = false
                index++
            }
            continue
        }
        if (escaping) {
            escaping = false
            continue
        }
        if (inString) {
            if (c == '\\' as char) {
                escaping = true
            } else if (c == '"' as char) {
                inString = false
            }
            continue
        }
        if (inChar) {
            if (c == '\\' as char) {
                escaping = true
            } else if (c == "'" as char) {
                inChar = false
            }
            continue
        }

        if (c == '/' as char && next == '/' as char) {
            inLineComment = true
            index++
        } else if (c == '/' as char && next == '*' as char) {
            inBlockComment = true
            index++
        } else if (c == '"' as char) {
            inString = true
        } else if (c == "'" as char) {
            inChar = true
        } else if (c == '(' as char) {
            if (depth == 0) {
                currentOpen = index
            }
            depth++
        } else if (c == ')' as char) {
            depth--
            if (depth == 0 && currentOpen >= 0) {
                lastPair = [open: currentOpen, close: index]
            }
        }
    }
    lastPair
}

def splitTopLevelCommaText = { String text ->
    def parts = []
    boolean inString = false
    boolean inChar = false
    boolean escaping = false
    int parenDepth = 0
    int angleDepth = 0
    int bracketDepth = 0
    int start = 0

    for (int index = 0; index < text.length(); index++) {
        char c = text.charAt(index)
        if (escaping) {
            escaping = false
            continue
        }
        if (inString) {
            if (c == '\\' as char) {
                escaping = true
            } else if (c == '"' as char) {
                inString = false
            }
            continue
        }
        if (inChar) {
            if (c == '\\' as char) {
                escaping = true
            } else if (c == "'" as char) {
                inChar = false
            }
            continue
        }

        if (c == '"' as char) {
            inString = true
        } else if (c == "'" as char) {
            inChar = true
        } else if (c == '(' as char) {
            parenDepth++
        } else if (c == ')' as char) {
            parenDepth = Math.max(0, parenDepth - 1)
        } else if (c == '[' as char) {
            bracketDepth++
        } else if (c == ']' as char) {
            bracketDepth = Math.max(0, bracketDepth - 1)
        } else if (c == '<' as char) {
            angleDepth++
        } else if (c == '>' as char) {
            angleDepth = Math.max(0, angleDepth - 1)
        } else if (c == ',' as char && parenDepth == 0 && angleDepth == 0 && bracketDepth == 0) {
            parts << text.substring(start, index)
            start = index + 1
        }
    }
    parts << text.substring(start)
    parts
}

def singleLineDeclarationPart = { String text ->
    text.readLines().collect { it.trim() }.findAll { !it.isEmpty() }.join(" ").replaceAll(/\s+/, " ")
}

def javaMemberIndent = "  "

def indentFirstLine = { String text, String indent ->
    if (indent.isEmpty() || text.isEmpty()) {
        return text
    }
    "${indent}${text}"
}

def normalizeParameterizedDeclarationHeader = { String text ->
    def markerInfo = findDeclarationMarker(text, 0, text.length())
    if (markerInfo == null) {
        return text
    }

    def markerIndex = markerInfo.index as int
    def marker = markerInfo.marker as char
    def pair = findLastTopLevelParenPair(text, 0, markerIndex)
    if (pair == null) {
        def header = text.substring(0, markerIndex).replaceAll(/[ \t]+$/, "")
        return header + (marker == '{' as char ? " {" : ";") + text.substring(markerIndex + 1)
    }

    int open = pair.open as int
    int close = pair.close as int
    def prefix = text.substring(0, open).replaceAll(/[ \t\r\n]+$/, "")
    def params = text.substring(open + 1, close)
    def suffix = singleLineDeclarationPart(text.substring(close + 1, markerIndex))
    def suffixText = suffix.isEmpty() ? "" : " ${suffix}"
    def remainder = text.substring(markerIndex + 1)
    def baseIndent = lineIndentAt(text, open)

    if (params.trim().isEmpty()) {
        def header = "${prefix}()${suffixText}"
        if (marker == ';' as char) {
            return "${header};${remainder}"
        }
        if (remainder.trim() == "}") {
            return "${header} {}"
        }
        return "${header} {${remainder}"
    }

    def paramIndent = "${baseIndent}    "
    def paramLines = splitTopLevelCommaText(params).collect { singleLineDeclarationPart(it) }.findAll { !it.isEmpty() }
    def rebuilt = new StringBuilder()
    rebuilt << prefix << "(\n"
    paramLines.eachWithIndex { param, index ->
        rebuilt << paramIndent << param
        if (index + 1 < paramLines.size()) {
            rebuilt << ","
        }
        rebuilt << "\n"
    }
    rebuilt << baseIndent << ")" << suffixText
    if (marker == ';' as char) {
        rebuilt << ";" << remainder
    } else if (remainder.trim() == "}") {
        rebuilt << " {}"
    } else {
        rebuilt << " {" << remainder
    }
    rebuilt.toString()
}

def parseAnnotationAt = { String text, int start ->
    int index = start
    if (index >= text.length() || text.charAt(index) != '@' as char) {
        return null
    }
    index++

    int nameStart = index
    while (index < text.length()) {
        def c = text.charAt(index)
        if (Character.isLetterOrDigit(c) || c == '_' as char || c == '.' as char || c == '$' as char) {
            index++
        } else {
            break
        }
    }
    if (index == nameStart) {
        return null
    }

    while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
        index++
    }
    if (index < text.length() && text.charAt(index) == '(' as char) {
        boolean inString = false
        boolean inChar = false
        boolean escaping = false
        int depth = 0
        while (index < text.length()) {
            char c = text.charAt(index)
            if (escaping) {
                escaping = false
            } else if (inString) {
                if (c == '\\' as char) {
                    escaping = true
                } else if (c == '"' as char) {
                    inString = false
                }
            } else if (inChar) {
                if (c == '\\' as char) {
                    escaping = true
                } else if (c == "'" as char) {
                    inChar = false
                }
            } else if (c == '"' as char) {
                inString = true
            } else if (c == "'" as char) {
                inChar = true
            } else if (c == '(' as char) {
                depth++
            } else if (c == ')' as char) {
                depth--
                if (depth == 0) {
                    index++
                    break
                }
            }
            index++
        }
        if (depth != 0 || inString || inChar) {
            return null
        }
    }

    [start: start, end: index]
}

def normalizeAnnotationText = { String text ->
    singleLineDeclarationPart(text)
            .replace("( ", "(")
            .replace(" )", ")")
            .replaceAll(/\s*,\s*/, ", ")
}

def normalizeClassDeclarationHeader = { String text, String declarationIndent ->
    def markerInfo = findDeclarationMarker(text, 0, text.length())
    if (markerInfo == null || markerInfo.marker != '{' as char) {
        return text
    }

    int markerIndex = markerInfo.index as int
    def prefix = text.substring(0, markerIndex)
    def suffix = text.substring(markerIndex + 1)
    def annotations = []
    int cursor = 0
    while (cursor < prefix.length()) {
        while (cursor < prefix.length() && Character.isWhitespace(prefix.charAt(cursor))) {
            cursor++
        }
        def annotation = parseAnnotationAt(prefix, cursor)
        if (annotation == null) {
            break
        }
        annotations << normalizeAnnotationText(prefix.substring(annotation.start as int, annotation.end as int))
        cursor = annotation.end as int
    }

    def declarationPart = singleLineDeclarationPart(prefix.substring(cursor))
    def normalizedDeclaration = normalizeParameterizedDeclarationHeader("${declarationIndent}${declarationPart} {")
            .replaceAll(/\s+\{\s*$/, " {")

    def lines = []
    if (!annotations.isEmpty()) {
        lines << "${declarationIndent}${annotations.join(" ")}"
    }
    lines << normalizedDeclaration
    lines.join("\n") + suffix
}

def normalizeMethodOrConstructorBlock = { String text ->
    normalizeParameterizedDeclarationHeader(trimBlankEdges(text))
}

def normalizeFieldOrInitializerBlock = { String text ->
    trimBlankEdges(text)
}

