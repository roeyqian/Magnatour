def findImportGroup = { String importLine, List importGroups ->
	def importedQualifiedName = importLine.substring("import ".length()).replace(";", "").trim()
	if (importedQualifiedName.startsWith("static ")) {
		importedQualifiedName = importedQualifiedName.substring("static ".length())
	}

	def matchingImportGroup = importGroups.find { group ->
		group.prefixes.any { prefix -> importedQualifiedName.startsWith(prefix) }
	}
	matchingImportGroup ?: importGroups.find { group -> group.title == "Other" }
}

def buildImportSortKey = { String importLine ->
	def importedQualifiedName = importLine.substring("import ".length()).replace(";", "").trim()
	if (importedQualifiedName.startsWith("static ")) {
		importedQualifiedName = importedQualifiedName.substring("static ".length()).trim()
	}
	[segments: importedQualifiedName.tokenize("."), name: importedQualifiedName, line: importLine]
}

def parseAnnotationOnlyLine = { String line ->
	def matcher = line =~ /^(\s*)(\S(?:.*\S)?)\s*$/
	if (!matcher.matches()) {
		return null
	}

	def indent = matcher.group(1)
	def text = matcher.group(2).trim()
	def index = 0
	def hasAnnotation = false

	while (true) {
		while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
			index++
		}
		if (index >= text.length()) {
			break
		}
		if (text.charAt(index) != '@' as char) {
			return null
		}
		hasAnnotation = true
		index++

		def annotationNameStart = index
		while (index < text.length()) {
			def currentCharacter = text.charAt(index)
			if (Character.isLetterOrDigit(currentCharacter) || currentCharacter == '_' as char || currentCharacter == '.' as char || currentCharacter == '$' as char) {
				index++
			} else {
				break
			}
		}
		if (index == annotationNameStart) {
			return null
		}

		while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
			index++
		}
		if (index < text.length() && text.charAt(index) == '(' as char) {
			def parenthesisDepth = 0
			def insideStringLiteral = false
			def insideCharacterLiteral = false
			def isEscapedCharacter = false
			while (index < text.length()) {
				def currentCharacter = text.charAt(index)
				if (isEscapedCharacter) {
					isEscapedCharacter = false
				} else if (insideStringLiteral) {
					if (currentCharacter == '\\' as char) {
						isEscapedCharacter = true
					} else if (currentCharacter == '"' as char) {
						insideStringLiteral = false
					}
				} else if (insideCharacterLiteral) {
					if (currentCharacter == '\\' as char) {
						isEscapedCharacter = true
					} else if (currentCharacter == "'" as char) {
						insideCharacterLiteral = false
					}
				} else if (currentCharacter == '"' as char) {
					insideStringLiteral = true
				} else if (currentCharacter == "'" as char) {
					insideCharacterLiteral = true
				} else if (currentCharacter == '(' as char) {
					parenthesisDepth++
				} else if (currentCharacter == ')' as char) {
					parenthesisDepth--
					if (parenthesisDepth == 0) {
						index++
						break
					}
					if (parenthesisDepth < 0) {
						return null
					}
				}
				index++
			}
			if (parenthesisDepth != 0 || insideStringLiteral || insideCharacterLiteral) {
				return null
			}
		}

		while (index < text.length() && Character.isWhitespace(text.charAt(index))) {
			index++
		}
		if (index >= text.length()) {
			break
		}
		if (text.charAt(index) != '@' as char) {
			return null
		}
	}

	hasAnnotation ? [indent: indent, text: text] : null
}

